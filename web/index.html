<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saint Seiya: Sacro Imperio</title>
<style>
  :root {
    --bg-darkest: #0B0F1A;
    --bg-panel: #141B2E;
    --bg-panel-alt: #1B2438;
    --border: #2A3550;
    --gold: #D4AF37;
    --gold-dim: #8A7229;
    --cosmo-blue: #3FA9F5;
    --cosmo-blue-dim: #245A7C;
    --text-primary: #EAE6DA;
    --text-secondary: #9BA3B7;
    --danger: #C0392B;
    --success: #3FA96A;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg-darkest);
    color: var(--text-primary);
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 24px;
  }
  h1, h2, h3 { margin: 0 0 12px 0; }
  h1 { color: var(--gold); font-size: 26px; }
  h2 { color: var(--cosmo-blue); font-size: 16px; }
  .hint { color: var(--text-secondary); font-size: 13px; }
  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  button {
    background: var(--gold-dim);
    color: var(--bg-darkest);
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    margin: 4px 4px 4px 0;
  }
  button:hover { background: var(--gold); }
  button:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--cosmo-blue);
    border: 1px solid var(--cosmo-blue-dim);
  }
  button.secondary:hover { background: var(--bg-panel-alt); }
  input, select {
    background: var(--bg-panel-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text-primary);
    font-size: 14px;
    width: 100%;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .bar-wrap {
    background: var(--bg-panel-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    height: 20px;
    position: relative;
    overflow: hidden;
    margin: 4px 0 10px 0;
  }
  .bar-fill {
    height: 100%;
    background: var(--cosmo-blue);
    transition: width 0.2s;
  }
  .bar-fill.stamina { background: var(--gold); }
  .bar-fill.vita { background: var(--danger); }
  .bar-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    text-shadow: 0 0 3px #000;
  }
  .stats-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat-chip {
    background: var(--bg-panel-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    text-align: center;
    min-width: 80px;
  }
  .stat-chip .value { font-size: 20px; font-weight: 700; }
  .stat-chip .label { font-size: 11px; color: var(--text-secondary); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--gold); }
  tr.selectable { cursor: pointer; }
  tr.selectable:hover { background: var(--bg-panel-alt); }
  tr.selected { background: var(--cosmo-blue-dim); }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: transparent;
    color: var(--text-secondary);
    border: none;
    border-bottom: 3px solid transparent;
    border-radius: 0;
    padding: 10px 16px;
    margin: 0;
  }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 700; }
  .log-line { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .log-box { max-height: 300px; overflow-y: auto; }
  .status-bar {
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    margin-bottom: 16px;
  }
  .status-bar .calendar { color: var(--cosmo-blue); font-weight: 600; white-space: nowrap; }
  .status-bar .mini-bar { width: 240px; }
  .status-bar .mini-bar .bar-wrap { height: 26px; margin: 0; }
  .status-bar .mini-bar .bar-label { font-size: 13px; font-weight: 700; }
  .hidden { display: none !important; }
  #error-banner {
    background: var(--danger);
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* Disposizione dell'Arena: pannello combattente sinistro, mappa al
     centro, pannello combattente destro - pensata per estendersi in
     futuro a più cavalieri per lato (richiesto in chat). Su schermi
     stretti i pannelli scendono sotto la mappa invece di schiacciarsi. */
  .arena-columns { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .fighter-panel {
    flex: 1 1 220px;
    min-width: 220px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .fighter-panel.opponent-panel button { opacity: 0.55; cursor: not-allowed; }
  .arena-map-column { flex: 2 1 340px; min-width: 300px; }

  /* Scheda Cavaliere/Home come "carta d'identità" (richiesta in chat,
     schizzo fornito): immagine grande a sinistra, a destra impilati
     Dati Anagrafici / BG Personaggio / Statistiche+Progressione;
     sotto, Tecniche e Diario affiancati. */
  .sheet-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "image identity"
      "image background"
      "image stats"
      "techniques diary";
    gap: 16px;
    align-items: stretch;
  }
  .sheet-image { grid-area: image; }
  .sheet-identity { grid-area: identity; }
  .sheet-background { grid-area: background; }
  .sheet-stats { grid-area: stats; }
  .sheet-techniques { grid-area: techniques; }
  .sheet-diary { grid-area: diary; }

  /* --- Schermi stretti (smartphone) --- */
  @media (max-width: 640px) {
    body { padding: 12px; }
    h1 { font-size: 21px; }
    h2 { font-size: 15px; }
    .card { padding: 12px 14px; }
    button { padding: 10px 14px; font-size: 13px; }

    /* La barra di stato: da riga unica (calendario + 2 barre da 240px,
       non ci stanno in 360px di schermo) a colonna impilata, ogni
       elemento largo quanto lo schermo - segnalato in chat, prima
       nessuno l'aveva ancora provata da telefono. */
    .status-bar { flex-direction: column; align-items: stretch; gap: 10px; }
    .status-bar .calendar { white-space: normal; text-align: center; }
    .status-bar .mini-bar { width: 100%; }

    .stat-chip { min-width: 64px; padding: 8px 10px; }
    .stat-chip .value { font-size: 17px; }
    .tab-btn { padding: 8px 10px; font-size: 13px; }

    /* Le tabelle (elenco partite, elenco armature) restano leggibili:
       invece di schiacciarsi o sforare lo schermo, scorrono in
       orizzontale con un dito - vedi .table-scroll nel markup. */
    table { font-size: 12px; }
    th, td { padding: 5px 6px; }

    /* La carta d'identità: da due colonne a una sola, impilata
       nell'ordine naturale di lettura. */
    .sheet-grid {
      grid-template-columns: 1fr;
      grid-template-areas: "image" "identity" "background" "stats" "techniques" "diary";
    }
  }
</style>
</head>
<body>

<div id="error-banner" class="hidden"></div>
<div id="app"></div>

<script>
const $ = (sel) => document.querySelector(sel);
// Potenza della Difesa Base generica (richiesto in chat: "Difesa Base
// + tecniche di difesa", stessa struttura dell'Attacco Base) - deve
// combaciare con DEFAULT_DEFENSE_POWER lato backend.
const DEFAULT_DEFENSE_POWER = 10;

// Il Cosmo come risorsa per le tecniche (richiesto in chat, le tre
// barre) - stessa formula del backend (core/arena_manager.py,
// technique_cosmo_cost), per mostrare il costo e disabilitare i
// pulsanti che non ci si può permettere PRIMA di provare a inviarli,
// non solo dopo un rifiuto del server.
const TECHNIQUE_COSMO_COST_DIVISOR = 10;
function techniqueCosmoCost(name, power) {
  if (name === "Attacco Base" || !power) return 0;
  return Math.max(1, Math.floor(power / TECHNIQUE_COSMO_COST_DIVISOR));
}

const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "onClick") node.addEventListener("click", v);
    else if (k === "class") node.className = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    node.append(c instanceof Node ? c : document.createTextNode(c));
  }
  return node;
};

// Toglie i numeri "da regolamento" (tiro vs CA, dado naturale) E le
// icone usate come segnaposto visivo negli elenchi, lasciando una
// frase pulita da poter leggere come prosa - deciso in chat: la prima
// versione toglieva solo i numeri ma restava comunque un elenco
// puntato, non un vero racconto (segnalato in chat, corretto qui). Il
// danno inflitto (— Danno: N) resta: interessa a chi gioca, non è un
// dettaglio da tavolo di regole.
function stripTechnicalDetails(line) {
  return line
    .replace(/\s*\(\d+\s*vs\s*CA\s*\d+\)/g, "")
    .replace(/\s*\(\d+\s*naturale\)/g, "")
    .replace(/^[⚔🎲⚠️☠️🏆💀✨⚡🎉🌟]+\s*/u, "")
    .trim();
}

// --- Stato globale della pagina (nessun framework, solo un oggetto e un render()) ---
const state = {
  screen: "startPage",       // startPage | loadGame | creation | game
  appVersion: null,         // recuperata all'avvio da GET / (fonte di verità: core/version.py)
  characters: [],
  characterId: null,
  character: null,          // payload completo dell'ultima GET /characters/{id}
  gameTab: "sheet",         // sheet | training | arena
  armors: [],
  weeklySchedule: [],
  battle: null,             // battle_state, o null fuori combattimento
  opponentCandidates: null, // sala d'attesa: 5 avversari tra cui scegliere, o null
  lastDifficulty: null,     // l'ultima difficoltà cercata, per "Cerca altri avversari" senza rifare la scelta
  creationMode: null,       // null | "detailed" - la scelta nella creazione personaggio
  roster: null,              // la Gerarchia (tutte le armature + chi le occupa), null finché non caricata
  chronicle: null,           // la Cronaca del Mondo (eventi accaduti ai PNG nel tempo), null finché non caricata
  biography: null,           // il Diario del personaggio corrente (abbozzo + voci), null finché non caricato
  customTechniques: null,    // le tecniche personalizzate del personaggio corrente (+ slot), null finché non caricate
  showCounterPicker: false,  // sta scegliendo la tecnica per il Contrattacco?
  showDefensePicker: false,  // sta scegliendo la tecnica per la Difesa? (richiesto in chat: prima era automatica)
  institutionalNpcs: null,   // le figure istituzionali del mondo (statiche, non legate a un personaggio), null finché non caricate
  editingBackground: false,  // sta modificando il background nella Scheda Cavaliere?
  trainingPath: null,        // lo stato del percorso di Apprendistato del personaggio corrente, null finché non caricato
  trialResult: null,         // il risultato appena arrivato della Prova Finale, da mostrare prima di procedere
  sparResult: null,          // il risultato appena arrivato dello scontro leggero d'allenamento, da mostrare prima di procedere
  stageAttemptResult: null,  // il risultato appena arrivato di una prova a dado di una tappa, da mostrare prima di procedere
  stageChoiceResult: null,   // l'esito appena arrivato di una scelta di una tappa, da mostrare prima di procedere
  missionStatus: null,       // lo stato della missione in corso (o {active:false}), null finché non caricato
  missionActionResult: null, // l'esito di un tentativo di persuasione o di una prova a dado di un nodo, da mostrare prima di procedere
  missionChoiceResult: null, // l'esito di una scelta di un nodo delle Colonne, da mostrare prima di procedere
  missionEndingResult: null, // il risultato di missione completata/fallita via duello, da mostrare prima di tornare all elenco
  confirmingAbandon: false,  // sta confermando l'abbandono di una missione?
  confirmingFateChoice: null, // sta confermando una delle alternative al fallimento della Prova Finale?
  deathResult: null,         // l'ultimo ricordo del personaggio appena morto (richiesto in chat), prima di tornare alla Sala dei Cavalieri
  soldierStatus: null,       // lo stato del Soldato Semplice (attività disponibili), null finché non caricato
  soldierActivityResult: null, // l'esito appena arrivato di un'attività da Soldato, da mostrare prima di procedere
  geoOrigins: null,          // albero Continente -> Macrozona -> Nazione per la Provenienza, null finché non caricato
  showTutorial: false,       // il tutorial iniziale è aperto in questo momento?
  tutorialStep: 0,           // a che passo del tutorial siamo
  trainingLog: [],
  arenaLog: [],
};

// --- Chiamate API: stesso indirizzo della pagina, nessun URL da configurare ---
async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `Errore HTTP ${res.status}`);
  }
  return res.json();
}

function showError(msg) {
  const banner = $("#error-banner");
  banner.textContent = msg;
  banner.classList.remove("hidden");
  setTimeout(() => banner.classList.add("hidden"), 6000);
}

// --- Pagina Iniziale (Nuova/Carica Partita) e schermata "Carica Partita" ---
// Rinominata da "Home" in chat: la vera Home (una volta dentro al
// gioco) sarà la Scheda Cavaliere - questa è solo la porta d'ingresso
// prima di aver caricato un personaggio, concettualmente diversa.
async function loadStartPage() {
  state.screen = "startPage";
  try {
    state.characters = await api("/characters");
  } catch (e) {
    showError(e.message);
    state.characters = [];
  }
  render();
}

async function loadStartScreen() {
  // "Carica Partita": l'elenco dei salvataggi tra cui scegliere -
  // usata sia dal pulsante omonimo in home, sia per tornare qui dopo
  // aver lasciato una partita in corso (più naturale che tornare alla
  // home vera e propria, visto che si era già dentro al gioco).
  state.screen = "loadGame";
  try {
    state.characters = await api("/characters");
  } catch (e) {
    showError(e.message);
    state.characters = [];
  }
  render();
}

async function selectCharacter(id) {
  state.characterId = id;
  state.biography = null;  // il diario del personaggio precedente non deve restare in vista
  state.customTechniques = null;  // idem per le tecniche personalizzate
  state.editingBackground = false;  // idem per una modifica del background lasciata a metà
  state.trainingPath = null;  // idem per il percorso di Apprendistato
  state.trialResult = null;
  state.sparResult = null;
  state.stageAttemptResult = null;
  state.stageChoiceResult = null;
  state.missionStatus = null;
  state.missionActionResult = null;
  state.missionChoiceResult = null;
  state.missionEndingResult = null;
  state.confirmingAbandon = false;
  state.confirmingFateChoice = null;
  state.deathResult = null;
  state.soldierStatus = null;
  state.soldierActivityResult = null;
  await refreshCharacter();
  state.screen = "game";
  state.gameTab = "sheet";
  maybeShowTutorial();
  render();
}

// --- Tutorial iniziale, saltabile (richiesto in chat) ---
// Sei passaggi essenziali, non un manuale completo - le meccaniche più
// fini (affinità elementale, effetti sul terreno nel dettaglio, ecc.)
// si scoprono giocando. Appare da solo la prima volta che si entra in
// una partita (knight.tutorial_seen === 0), resta riapribile a
// piacere dal pulsante "?" nella schermata di gioco.
const TUTORIAL_STEPS = [
  {
    title: "Benvenuto, Cavaliere",
    body: "Il tuo Cosmo è sia la tua energia per le tecniche sia la tua \"vita\" in combattimento - quando arriva a zero, lo scontro finisce. Il tuo Livello personaggio sale allenandoti e vincendo scontri, e sblocca armature più potenti in una nuova creazione.",
  },
  {
    title: "Centro Allenamento",
    body: "Imposta un programma settimanale (un obiettivo per giorno: Forza, Costituzione, Riposo, ecc.) e premi Avanza Settimana o Avanza Mese per farlo scorrere. Il tempo passa, il tuo personaggio migliora.",
  },
  {
    title: "Arena: trova un avversario",
    body: "Scegli una difficoltà, poi ti si presenta una sala d'attesa con 5 rivali tra cui scegliere - ognuno con nome, provenienza e armatura proprie.",
  },
  {
    title: "La mappa",
    body: "Ti muovi liberamente cliccando sulla mappa, entro i tuoi Punti Movimento. Le tecniche vere colpiscono a distanza; l'Attacco Base richiede stare vicini. Muoverti troppo in un round ti fa perdere l'attacco (ma puoi sempre Caricare).",
  },
  {
    title: "Combattimento",
    body: "Scegli Attacca o Carica; se l'avversario ti attacca, scegli se Difenditi o Incassa il colpo. Ogni tanto scatta un Imprevisto (un evento casuale dell'arena) - e un colpo forte può lasciare ghiaccio, fiamme, fango o un cratere sul terreno stesso.",
  },
  {
    title: "La Gerarchia",
    body: "Nella scheda Gerarchia trovi tutte le armature del gioco, ciascuna con un cavaliere assegnato - un PNG (etichettato in giallo) se nessun giocatore l'ha ancora presa, o il personaggio di chi l'ha reclamata.",
  },
];

function maybeShowTutorial() {
  if (state.character && !state.character.tutorial_seen) {
    state.showTutorial = true;
    state.tutorialStep = 0;
  }
}

async function closeTutorial() {
  state.showTutorial = false;
  if (state.character) state.character.tutorial_seen = true;
  render();
  if (state.characterId) {
    try {
      await api(`/characters/${state.characterId}/tutorial-seen`, { method: "POST" });
    } catch (e) {
      // Non blocchiamo l'esperienza per un errore di rete su un flag
      // puramente informativo - se fallisce, ricomparirà la prossima
      // volta, non è grave.
    }
  }
}

function renderTutorialOverlay() {
  if (!state.showTutorial) return null;
  const step = TUTORIAL_STEPS[state.tutorialStep];
  const overlay = el("div", {
    style: "position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;",
  });
  const box = el("div", { class: "card", style: "max-width:420px;width:100%;" });
  box.append(el("p", { class: "hint" }, `Passo ${state.tutorialStep + 1} di ${TUTORIAL_STEPS.length}`));
  box.append(el("h2", {}, step.title));
  box.append(el("p", {}, step.body));

  const btnRow = el("div", { class: "row", style: "margin-top:16px;justify-content:space-between;" });
  if (state.tutorialStep > 0) {
    btnRow.append(el("button", { class: "secondary", onClick: () => { state.tutorialStep--; render(); } }, "◄ Indietro"));
  }
  if (state.tutorialStep < TUTORIAL_STEPS.length - 1) {
    btnRow.append(el("button", { onClick: () => { state.tutorialStep++; render(); } }, "Avanti ►"));
  } else {
    btnRow.append(el("button", { onClick: closeTutorial }, "Ho capito, si comincia!"));
  }
  box.append(btnRow);
  box.append(el("button", { class: "secondary", style: "margin-top:10px;width:100%;", onClick: closeTutorial }, "Salta tutorial"));

  overlay.append(box);
  return overlay;
}

async function deleteCharacter(id, name) {
  if (!confirm(`Eliminare definitivamente "${name}"? Non si può annullare.`)) return;
  try {
    await api(`/characters/${id}`, { method: "DELETE" });
    await loadStartScreen();
  } catch (e) {
    showError(e.message);
  }
}

// --- Creazione personaggio ---
async function loadCreationScreen() {
  state.screen = "creation";
  state.creationMode = null;  // riparte sempre dalla scelta, ad ogni nuovo ingresso
  try {
    state.armors = await api("/armors?player_level=1");
  } catch (e) {
    showError(e.message);
    state.armors = [];
  }
  if (state.geoOrigins === null) {
    try {
      state.geoOrigins = await api("/geo-origins");
    } catch (e) {
      showError(e.message);
      state.geoOrigins = {};
    }
  }
  render();
}

const RANDOM_NAMES_MALE = ["Kenji", "Marco", "Aleksei", "Diego", "Chen", "Andrea", "Erik", "Rafael", "Luca", "Dmitri"];
const RANDOM_NAMES_FEMALE = ["Amara", "Sofia", "Yuki", "Elena", "Priya"];
const RANDOM_SURNAMES = ["Takeda", "Rossi", "Volkov", "Fernandez", "Wang", "Costa", "Nilsson", "Silva", "Moreau", "Petrova"];
const RANDOM_GENDERS = ["Maschio", "Femmina"];
const BUILD_OPTIONS = ["Minuta", "Media", "Robusta"];

// Pesca una nazione a caso dall'intero albero geografico (state.geoOrigins,
// caricato da GET /geo-origins) - usata dal Personaggio Casuale.
function randomCountryFromGeo() {
  const continents = Object.values(state.geoOrigins || {});
  if (continents.length === 0) return "";
  const zones = Object.values(randomFrom(continents));
  return randomFrom(randomFrom(zones).countries);
}

function randomFrom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

async function createRandomCharacter() {
  if (state.armors.length === 0) return showError("Nessuna armatura disponibile.");
  const armor = randomFrom(state.armors);
  // Il sesso si sceglie PRIMA del nome (corretto in chat: prima erano
  // indipendenti, capitava un "Sofia" con sesso "Maschio") - il nome
  // arriva da un elenco coerente con il sesso appena scelto.
  const gender = randomFrom(RANDOM_GENDERS);
  const namePool = gender === "Femmina" ? RANDOM_NAMES_FEMALE : RANDOM_NAMES_MALE;
  const details = {
    surname: randomFrom(RANDOM_SURNAMES),
    age: 14 + Math.floor(Math.random() * 9),  // 14-22, l'età tipica di un cavaliere
    gender,
    origin: randomCountryFromGeo(),
    build: randomFrom(BUILD_OPTIONS),
  };
  await createCharacter(randomFrom(namePool), armor.name, details);
}

async function createCharacter(rawName, armorName, details = {}) {
  try {
    const character = await api("/characters", {
      method: "POST",
      body: JSON.stringify({
        raw_name: rawName, armor_name: armorName, player_level: 1,
        surname: details.surname || "", age: details.age || 15,
        gender: details.gender || "", origin: details.origin || "", build: details.build || "Media",
        biography: details.biography || "",
        skin_tone: details.skin_tone || "", hair_color: details.hair_color || "",
      }),
    });
    state.characterId = character.id;
    state.character = character;
    state.biography = null;  // nuovo personaggio, il diario riparte da zero
    state.customTechniques = null;
    state.trainingPath = null;
    state.weeklySchedule = [...character.weekly_schedule_list];
    state.screen = "game";
    state.gameTab = "sheet";
    maybeShowTutorial();
    render();
  } catch (e) {
    showError(e.message);
  }
}

}

// --- Allenamento ---
async function doTrain(mode) {
  try {
    const result = await api(`/characters/${state.characterId}/train`, {
      method: "POST",
      body: JSON.stringify({ mode, schedule: state.weeklySchedule }),
    });
    state.character = result.character;
    state.weeklySchedule = [...state.character.weekly_schedule_list];
    state.trainingLog = result.log.map((l) => (l.day ? `${l.day} (${l.focus}): ${l.message}` : l.message));
    // Un level up durante l'allenamento può aggiungere una voce nuova al
    // diario - lo invalido sempre qui, si ricarica da solo la prossima
    // volta che si apre la Scheda Cavaliere (corretto in chat: prima
    // restava "vecchio" finché non si tornava alla Sala dei Cavalieri).
    state.biography = null;
    // Un level up può anche sbloccare un nuovo slot di tecnica
    // personalizzata - stesso motivo, si ricarica da sola.
    state.customTechniques = null;
    render();
  } catch (e) {
    showError(e.message);
  }
}

async function declareCharge() {

async function reactToAttack(action, technique) {
  try {
    const body = { action, battle_state: state.battle };
    if (action === "contrattacca" && technique) {
      body.counter_technique_name = technique.name;
      body.counter_technique_power = technique.power;
      body.counter_technique_type = technique.tech_type || null;
      body.counter_technique_launch_desc = technique.launch_desc || null;
      body.counter_technique_effect_desc = technique.effect_desc || null;
    }
    if (action === "difenditi" && technique) {
      // La difesa è ora una vera scelta del giocatore (richiesto in
      // chat: "Difesa Base + tecniche di difesa", stessa struttura
      // dell'attacco) - non più decisa in automatico dal sistema.
      body.defense_technique_name = technique.name;
      body.defense_technique_power = technique.power;
      body.defense_technique_type = technique.tech_type || null;
      body.defense_technique_launch_desc = technique.launch_desc || null;
      body.defense_technique_effect_desc = technique.effect_desc || null;
    }
    const result = await api(`/characters/${state.characterId}/arena/react`, {
      method: "POST",
      body: JSON.stringify(body),
    });
    applyArenaResult(result);
  } catch (e) {
    showError(e.message);
  }
}

async function retreat() {

    const result = await api(`/characters/${state.characterId}/arena/retreat`, { method: "POST" });
    state.character = result.character;
    state.battle = null;
    state.opponentCandidates = null;
    state.showCounterPicker = false;
    state.showDefensePicker = false;

// Chiamata dal pulsante "Torna alla Sala dei Cavalieri" (rinominato in
// chat da "Torna al Santuario" - troppo legato ad Athena, un nome che
// non presuppone nessuna divinità specifica visto che ormai il gioco
// non è più legato a un solo pantheon): se si esce mentre un
// combattimento è ancora aperto, ci si ritira PRIMA di lasciare la
// schermata di gioco - altrimenti il Cosmo restava bloccato basso per
// sempre (bug segnalato in chat: l'unica cosa che lo ricarica è finire
// uno scontro per davvero, vincendo, perdendo o ritirandosi).
async function goToKnightsHall() {
  if (state.battle) {
    try {
      await api(`/characters/${state.characterId}/arena/retreat`, { method: "POST" });
    } catch (e) {
      showError(e.message);
    }
  }
  state.battle = null;
  state.opponentCandidates = null;
  await loadStartScreen();
}

function applyArenaResult(result) {
  // Riconosce se lo scontro appena concluso era la Prova Finale o uno
  // scontro leggero d'allenamento (richiesto in chat: ora sono veri
  // combattimenti, non tiri di dado - vanno gestiti diversamente da
  // una normale vittoria/sconfitta in Arena) guardando i flag PRIMA
  // che state.battle venga sovrascritto.
  const wasTrial = state.battle && state.battle.is_trial;
  const wasSpar = state.battle && state.battle.is_spar;
  const wasMission = state.battle && state.battle.is_mission;
  state.character = result.character;
  state.arenaLog = [...state.arenaLog, ...result.log];
  state.battle = result.fight_over ? null : result.battle_state;
  state.showCounterPicker = false;  // ogni round risolto riparte pulito
  state.showDefensePicker = false;
  if (result.fight_over) {
    // Uno scontro concluso aggiunge sempre una voce al diario - stesso
    // fix di doTrain, invalido la cache per ricaricarla alla prossima
    // apertura della Scheda Cavaliere.
    state.biography = null;
    if (wasTrial) {
      // Le alternative al fallimento (richiesto in chat) - non si
      // resetta più da sola la tappa di ripreparazione: la scelta
      // (ritenta, riaddestrati altrove, diventa Soldato Semplice,
      // muori) spetta ora al giocatore, gestita dentro
      // renderTrainingPathTab finché sceglie - trainingPath non si
      // ricarica ancora qui, solo dopo la scelta.
      state.trialResult = { passed: result.won, companionFates: result.companion_fates || null };
    } else if (wasSpar) {
      // Lo scontro leggero avanza comunque, vinca o perda (richiesto
      // in chat) - ma merita comunque un riscontro chiaro prima di
      // tornare al percorso, non solo un messaggio di passaggio.
      state.sparResult = { won: result.won };
      state.trainingPath = null;
    } else if (wasMission) {
      // Un duello delle Missioni concluso (richiesto in chat) - se ha
      // completato l'intera missione, mostra la ricompensa/il finale;
      // altrimenti si torna semplicemente allo stato della missione
      // (Casa/nodo successivo se vinto, la stessa se perso - si
      // sceglierà se ritentare o abbandonare).
      if (result.mission_completed) {
        state.missionEndingResult = { text: result.mission_ending_text };
      } else {
        state.arenaLog.push(result.won ? "Hai vinto lo scontro." : "Sei stato sconfitto - puoi ritentare, o abbandonare la missione.");
      }
      state.missionStatus = null;
    } else {
      state.arenaLog.push(result.won ? "🏆 Vittoria!" : "💀 Sconfitta...");
    }
  }
  render();
}

// --- Rendering ---
function render() {
  const app = $("#app");
  app.innerHTML = "";
  if (state.screen === "startPage") app.append(renderStartPage());
  else if (state.screen === "loadGame") app.append(renderLoadGameScreen());
  else if (state.screen === "creation") app.append(renderCreationScreen());
  else if (state.screen === "game") app.append(renderGameScreen());

  const tutorialOverlay = renderTutorialOverlay();
  if (tutorialOverlay) app.append(tutorialOverlay);

  // Ogni render ricostruisce la pagina da zero, quindi la cronaca
  // perdeva sempre lo scorrimento e tornava a mostrare i messaggi più
  // vecchi (segnalato in chat) - la riportiamo in fondo, dove sta
  // l'ultimo messaggio appena aggiunto. Ora possono essercene due
  // insieme (narrazione + dettagli tecnici), quindi li scorriamo tutti.
  document.querySelectorAll(".log-box").forEach((box) => {
    box.scrollTop = box.scrollHeight;
  });
}

      <circle cx="34" cy="128" r="1.3" fill="#3FA9F5"/>

function renderCreationScreen() {
  const wrap = el("div");
  wrap.append(el("h1", {}, "Crea il tuo Cavaliere"));

  if (!state.creationMode) {
    const modeCard = el("div", { class: "card" });
    modeCard.append(el("h2", {}, "Come vuoi iniziare?"));
    modeCard.append(el("button", { onClick: createRandomCharacter }, "🎲 Personaggio Casuale"));
    modeCard.append(el("button", {
      class: "secondary",
      onClick: () => { state.creationMode = "detailed"; render(); },
    }, "✏️ Crea Come Vuoi Tu"));
    wrap.append(modeCard);
    wrap.append(el("button", { class: "secondary", onClick: loadStartPage }, "Annulla"));
    return wrap;
  }

  // --- Modalità "Crea Come Vuoi Tu": modulo esteso, richiesto in chat ---
  const nameCard = el("div", { class: "card" });
  nameCard.append(el("h2", {}, "Chi è il tuo Cavaliere"));

  const row1 = el("div", { class: "row" });
  const nameInput = el("input", { placeholder: "Nome (es. Seiya)" });
  const surnameInput = el("input", { placeholder: "Cognome (opzionale)" });
  row1.append(nameInput, surnameInput);
  nameCard.append(row1);

  const row2 = el("div", { class: "row" });
  const ageInput = el("input", { type: "number", placeholder: "Età", value: "15", min: "10", max: "99" });
  const genderSelect = el("select", {});
  for (const g of ["", "Maschio", "Femmina", "Altro"]) {
    genderSelect.append(el("option", { value: g }, g || "Sesso (opzionale)"));
  }
  const buildSelect = el("select", {});
  for (const b of BUILD_OPTIONS) {
    buildSelect.append(el("option", { value: b, ...(b === "Media" ? { selected: "selected" } : {}) }, b));
  }
  row2.append(ageInput, genderSelect, buildSelect);
  nameCard.append(row2);

  // Provenienza: menu a cascata Continente -> Macrozona -> Nazione
  // (richiesto in chat: l'elenco piatto di 10 nazioni era troppo
  // scarno). L'albero arriva da GET /geo-origins, la stessa fonte di
  // verità usata dal server per l'affinità elementale in combattimento.
  const row3 = el("div", { class: "row" });
  const continentSelect = el("select", {});
  const macrozoneSelect = el("select", { disabled: "disabled" });
  const countrySelect = el("select", { disabled: "disabled" });

  continentSelect.append(el("option", { value: "" }, "Continente (opzionale)"));
  for (const continent of Object.keys(state.geoOrigins || {}).sort()) {
    continentSelect.append(el("option", { value: continent }, continent));
  }
  macrozoneSelect.append(el("option", { value: "" }, "Macrozona"));
  countrySelect.append(el("option", { value: "" }, "Nazione"));

  continentSelect.addEventListener("change", () => {
    macrozoneSelect.innerHTML = "";
    countrySelect.innerHTML = "";
    countrySelect.append(el("option", { value: "" }, "Nazione"));
    countrySelect.disabled = true;
    const continent = continentSelect.value;
    if (!continent) {
      macrozoneSelect.append(el("option", { value: "" }, "Macrozona"));
      macrozoneSelect.disabled = true;
      return;
    }
    macrozoneSelect.disabled = false;
    macrozoneSelect.append(el("option", { value: "" }, "Macrozona"));
    for (const zone of Object.keys(state.geoOrigins[continent]).sort()) {
      macrozoneSelect.append(el("option", { value: zone }, zone));
    }
  });

  macrozoneSelect.addEventListener("change", () => {
    countrySelect.innerHTML = "";
    const continent = continentSelect.value;
    const zone = macrozoneSelect.value;
    if (!zone) {
      countrySelect.append(el("option", { value: "" }, "Nazione"));
      countrySelect.disabled = true;
      return;
    }
    countrySelect.disabled = false;
    countrySelect.append(el("option", { value: "" }, "Nazione"));
    for (const country of state.geoOrigins[continent][zone].countries) {
      countrySelect.append(el("option", { value: country }, country));
    }
  });

  row3.append(continentSelect, macrozoneSelect, countrySelect);
  nameCard.append(row3);
  nameCard.append(el("p", { class: "hint" }, "La provenienza dà un piccolo bonus/resistenza con l'elemento della sua macrozona. La corporatura sposta la Costituzione di partenza."));

  // Background (richiesto in chat): l'abbozzo iniziale del diario, da
  // cui il gioco continua a scrivere da solo (level up, Sensi,
  // vittorie/sconfitte) man mano che si gioca.
  const biographyInput = el("textarea", {
    placeholder: "Background (opzionale) - da dove viene, cosa lo spinge a diventare un cavaliere...",
    rows: "3", style: "width:100%;resize:vertical;",
  });
  nameCard.append(el("p", { class: "hint", style: "margin-top:12px;" }, "Il tuo diario comincia da qui - il gioco continuerà a scriverlo da solo man mano che giochi."));
  nameCard.append(biographyInput);
  wrap.append(nameCard);

  const armorCard = el("div", { class: "card" });
  armorCard.append(el("h2", {}, `Scegli l'armatura (${state.armors.length} disponibili al livello 1)`));
  const table = el("table");
  table.append(el("tr", {}, el("th", {}, "Armatura"), el("th", {}, "Divinità"), el("th", {}, "Fazione"), el("th", {}, "Livello")));
  let selectedArmor = null;
  for (const a of state.armors) {
    const row = el("tr", { class: "selectable" },
      el("td", {}, a.name), el("td", {}, a.divinity), el("td", {}, a.faction), el("td", {}, String(a.level)));
    row.addEventListener("click", () => {
      table.querySelectorAll("tr.selected").forEach((r) => r.classList.remove("selected"));
      row.classList.add("selected");
      selectedArmor = a.name;
    });
    table.append(row);
  }
  const armorScrollWrap = el("div", { class: "table-scroll" });
  armorScrollWrap.append(table);
  armorCard.append(armorScrollWrap);
  wrap.append(armorCard);

  const createBtn = el("button", {
    onClick: () => {
      const name = nameInput.value.trim();
      if (!name) return showError("Inserisci un nome per il personaggio.");
      if (!selectedArmor) return showError("Seleziona un'armatura dalla tabella.");
      const age = parseInt(ageInput.value, 10) || 15;
      createCharacter(name, selectedArmor, {
        surname: surnameInput.value.trim(),
        age,
        gender: genderSelect.value,
        origin: countrySelect.value,
        build: buildSelect.value,
        biography: biographyInput.value.trim(),
      });
    },
  }, "Crea e Seleziona");
  wrap.append(createBtn);
  wrap.append(el("button", { class: "secondary", onClick: () => { state.creationMode = null; render(); } }, "◄ Indietro"));
  return wrap;
}

function renderGameScreen() {
  const wrap = el("div");
  const k = state.character;

  // --- Barra di stato, sempre visibile ---
  const statusBar = el("div", { class: "status-bar" });
  statusBar.append(el("span", { class: "calendar" }, "📅 " + k.calendar.label));
  statusBar.append(renderMiniBar("Vita", k.vita_cur, k.vita_max, "vita"));
  statusBar.append(renderMiniBar("Cosmo", k.cosmo_cur, k.cosmo_max, "cosmo"));
  statusBar.append(renderMiniBar("Stamina", k.stamina, 100, "stamina"));
  wrap.append(statusBar);

  // --- Tabs ---
  const tabs = el("div", { class: "tabs" });
  // Finché è Apprendista (richiesto in chat), Allenamento e Arena sono
  // sostituiti da un'unica scheda "Percorso" - non ha senso mostrarli
  // se sono comunque bloccati lato server.
  const isSoldier = !k.is_knight && k.apprentice_status === "soldier";
  const tabDefs = k.is_knight
    ? [["sheet", "Scheda Cavaliere"], ["training", "Centro Allenamento"], ["arena", "Arena del Santuario"], ["missions", "Missioni"], ["hierarchy", "Gerarchia"], ["chronicle", "Cronaca del Mondo"]]
    : isSoldier
    ? [["sheet", "Scheda Cavaliere"], ["soldier", "Servizio"], ["hierarchy", "Gerarchia"], ["chronicle", "Cronaca del Mondo"]]
    : [["sheet", "Scheda Cavaliere"], ["percorso", "Percorso"], ["training", "Centro Allenamento"], ["arena", "Arena del Santuario"], ["hierarchy", "Gerarchia"], ["chronicle", "Cronaca del Mondo"]];
  // Allenamento e Arena ora restano visibili anche da Apprendista
  // (richiesto in chat: prima sparivano del tutto dalla barra, e senza
  // vederle il tutorial che le nomina risultava incomprensibile) - il
  // blocco vero avviene dentro le due schede stesse, con un messaggio
  // che spiega perché.
  for (const [key, label] of tabDefs) {
    tabs.append(el("button", {
      class: "tab-btn" + (state.gameTab === key ? " active" : ""),
      onClick: () => {
        // Il log è condiviso con Allenamento/Missioni (richiesto in
        // chat: prima capitava di vedere ancora il resoconto di un
        // duello d'addestramento entrando in Arena) - lo si pulisce
        // solo entrando in Arena dall'esterno, e solo se non c'è
        // davvero un combattimento in Arena in corso da riprendere.
        if (key === "arena" && state.gameTab !== "arena" && !state.battle) {
          state.arenaLog = [];
        }
        state.gameTab = key;
        render();
      },
    }, label));
  }
  // Riapre il tutorial in ogni momento (richiesto in chat), senza
  // toccare il flag "già visto" - resta sempre disponibile a chi vuole
  // rivederlo, anche dopo averlo già chiuso una volta.
  tabs.append(el("button", {
    class: "tab-btn", title: "Rivedi il tutorial",
    onClick: () => { state.showTutorial = true; state.tutorialStep = 0; render(); },
  }, "❓"));
  wrap.append(tabs);

  if (state.gameTab === "sheet") wrap.append(renderSheetTab());
  else if (state.gameTab === "percorso") wrap.append(renderTrainingPathTab());
  else if (state.gameTab === "training") wrap.append(renderTrainingTab());
  else if (state.gameTab === "arena") wrap.append(renderArenaTab());
  else if (state.gameTab === "missions") wrap.append(renderMissionsTab());
  else if (state.gameTab === "soldier") wrap.append(renderSoldierTab());
  else if (state.gameTab === "chronicle") wrap.append(renderChronicleTab());
  else if (state.gameTab === "hierarchy") wrap.append(renderHierarchyTab());

  wrap.append(el("button", { class: "secondary", onClick: goToKnightsHall }, "◄ Torna alla Sala dei Cavalieri"));
  return wrap;
}

function renderChronicleTab() {

    loadChronicle();
    wrap.append(el("div", { class: "card" }, el("p", { class: "hint" }, "Caricamento della Cronaca...")));

  }

  if (state.chronicle.length === 0) {
    wrap.append(el("div", { class: "card" }, el("p", { class: "hint" }, "Non è ancora successo nulla di notevole. Il mondo è giovane, o silenzioso - per ora.")));

function renderHierarchyTab() {
  const wrap = el("div");

  // Le Figure Istituzionali (richiesto in chat): un minimo di gdr,
  // statiche e non giocabili - Il Grande Sacerdote, Pandora, ecc.
  // Mostrate in cima, prima dell'elenco delle armature.
  if (state.institutionalNpcs === null) {
    loadInstitutionalNpcs();
  } else if (state.institutionalNpcs.length > 0) {
    const npcCard = el("div", { class: "card" });
    npcCard.append(el("h2", {}, "Le Figure del Sacro Imperio"));
    for (const npc of state.institutionalNpcs) {
      const block = el("div", { style: "margin-top:12px;" });
      block.append(el("p", {}, el("strong", {}, `${npc.name}`), ` — ${npc.divinity}`));
      block.append(el("p", { class: "hint" }, npc.role));
      block.append(el("p", {}, npc.description));
      block.append(el("p", { style: "font-style:italic;" }, `"${npc.quote}"`));
      npcCard.append(block);
    }
    wrap.append(npcCard);
  }

  if (state.roster === null) {
    loadRoster();
    wrap.append(el("div", { class: "card" }, el("p", { class: "hint" }, "Caricamento della Gerarchia...")));
    return wrap;
  }

  const groups = {};
  for (const r of state.roster) {
    groups[r.divinity] = groups[r.divinity] || {};
    groups[r.divinity][r.faction] = groups[r.divinity][r.faction] || [];
    groups[r.divinity][r.faction].push(r);
  }

  // Le fazioni si ordinano dal livello medio delle proprie armature,
  // più debole a più forte (corretto in chat: l'ordine alfabetico
  // mescolava Bronze/Gold/Silver a caso, senza nessuna gerarchia
  // vera). Il criterio si ricava dai dati stessi, niente elenco
  // scritto a mano per ciascuna delle 13 divinità.
  const averageFactionLevel = (entries) => entries.reduce((sum, e) => sum + e.level, 0) / entries.length;

  for (const divinity of Object.keys(groups).sort()) {
    const divCard = el("div", { class: "card" });
    divCard.append(el("h2", {}, divinity));
    const factionsByPower = Object.keys(groups[divinity]).sort(
      (a, b) => averageFactionLevel(groups[divinity][a]) - averageFactionLevel(groups[divinity][b])
    );
    for (const faction of factionsByPower) {
      divCard.append(el("p", { class: "hint", style: "margin-top:10px;font-weight:600;" }, faction));
      const table = el("table");
      table.append(el("tr", {}, el("th", {}, "Armatura"), el("th", {}, "Livello"), el("th", {}, "Occupante")));
      for (const entry of groups[divinity][faction]) {
        const playerDisplayName = [entry.claimed_by_raw_name, entry.claimed_by_surname].filter(Boolean).join(" ");
        const occupantCell = entry.claimed_by_raw_name
          ? el("td", {}, `${playerDisplayName} (livello ${entry.claimed_by_level})`)
          : el("td", {}, entry.npc_name, el("span", {
              style: "background:var(--gold);color:#1a1a1a;padding:1px 6px;border-radius:4px;font-size:10px;margin-left:6px;font-weight:700;",
            }, "PNG"),
            // Il mondo che vive per conto suo (richiesto in chat): se
            // questo PNG non è il primo ad indossare quest'armatura,
            // un piccolo indicatore lo segnala, col destino del
            // predecessore visibile al passaggio del mouse.
            entry.npc_generation > 1 ? el("span", {
              title: entry.npc_fate,
              style: "color:var(--text-secondary);font-size:10px;margin-left:6px;cursor:help;",
            }, `(${entry.npc_generation}ª generazione)`) : null);
        const row = el("tr", {}, el("td", {}, entry.armor_name), el("td", {}, String(entry.level)), occupantCell);
        table.append(row);
      }
      const scrollWrap = el("div", { class: "table-scroll" });
      scrollWrap.append(table);
      divCard.append(scrollWrap);
    }
    wrap.append(divCard);
  }

  return wrap;
}

function renderMiniBar(label, value, max, kind) {
  const wrap = el("div", { class: "mini-bar" });
  const barWrap = el("div", { class: "bar-wrap" });
  const pct = Math.max(0, Math.min(100, (value / Math.max(max, 1)) * 100));
  const fill = el("div", { class: "bar-fill" + (kind === "stamina" ? " stamina" : kind === "vita" ? " vita" : ""), style: `width:${pct}%` });
  barWrap.append(fill, el("div", { class: "bar-label" }, `${label}: ${value}/${max}`));
  wrap.append(barWrap);
  return wrap;
}

      throw new Error(body.detail || `Errore HTTP ${res.status}`);
    }
    const data = await res.json();
    state.character.avatar_path = data.avatar_path;
    render();
  } catch (e) {
    showError(e.message);
  }
}

// Riga di descrizione di una tecnica, con l'etichetta Offensiva/
// Difensiva/Entrambe ben visibile (richiesto in chat: prima si capiva
// solo leggendo "Difensivo" dentro il tech_type, poco a colpo
// d'occhio; "Entrambe" per le tecniche difensive canonicamente
// utilizzabili anche in attacco, come il Crystal Wall dell'Ariete che
// rimanda il colpo al mittente) - usata sia per le tecniche del
// catalogo sia per quelle personalizzate.
function techniqueLine(icon, t) {
  const typeLower = (t.tech_type || "").toLowerCase();
  const isDefensive = typeLower.includes("difensiv");
  const isDual = typeLower.includes("entrambe");
  const roleLabel = isDual ? "⚔🛡 Entrambe" : isDefensive ? "🛡 Difensiva" : "⚔ Offensiva";
  const cleanType = (t.tech_type || "").replace(/\/?difensiv[oa]/i, "").replace(/\/?entrambe/i, "").replace(/^\/|\/$/g, "");
  return `${icon} ${t.name} — ${cleanType || "—"} · ${roleLabel} (potenza ${t.power})`;
}

function renderSheetTab() {

  const grid = el("div", { class: "sheet-grid" });

  // --- Immagine PG: l'avatar caricato se c'è, altrimenti un

  const imageCard = el("div", { class: "card sheet-image" });
  if (k.avatar_path) {
    imageCard.append(el("img", { src: k.avatar_path, style: "width:100%;border-radius:8px;display:block;" }));

    imageCard.append(el("div", {

  const avatarFileInput = el("input", { type: "file", accept: "image/*", style: "display:none;" });

  }, k.avatar_path ? "📷 Cambia immagine" : "📷 Carica una tua immagine"));

  // --- Dati anagrafici ---
  const idCard = el("div", { class: "card sheet-identity" });

  const idLine = [
    `${k.armor.divinity} · ${k.armor.faction}`, `Livello armatura ${k.armor.level}`,

  // Stato esplicito Apprendista/Cavaliere (richiesto in chat: prima non

    ? "🎖️ Cavaliere"
    : el("span", {}, "🎓 Apprendista - in addestramento per diventare portatore di ", el("strong", {}, k.armor_name))));

  // --- BG Personaggio: solo l'abbozzo scritto alla creazione, non le
  // voci auto-generate (quelle sono nel Diario, più in basso -
  // separati come richiesto in chat) ---
  const bgCard = el("div", { class: "card sheet-background" });
  bgCard.append(el("h2", {}, "Background"));

    loadBiography();
    bgCard.append(el("p", { class: "hint" }, "Caricamento..."));
  } else if (state.editingBackground) {
    // Modifica del background dopo la creazione (richiesto in chat:

      rows: "4", style: "width:100%;resize:vertical;",
    });

  // --- Statistiche + Progressione, unite in una card sola ---

  statsCard.append(el("h2", {}, "Statistiche"));
  const statsGrid = el("div", { class: "stats-grid" });
  for (const [label, val] of [["FORZA", k.str], ["DESTREZZA", k.dex], ["COSTITUZIONE", k.con], ["TECNICA", k.tec], ["VOLONTÀ", k.vol]]) {

  }
  statsGrid.append(el("div", { class: "stat-chip" }, el("div", { class: "value" }, String(k.movement_points)), el("div", { class: "label" }, "MOVIMENTO")));

  statsCard.append(el("p", {}, `Livello personaggio ${k.player_level} · XP ${k.xp}`));

    `Sensi — Sesto ${mark(senses.sesto)} · Settimo ${mark(senses.settimo)} · Ottavo ${mark(senses.ottavo)} · Nono ${mark(senses.nono)}`));
  grid.append(statsCard);

  // --- Tecniche (catalogo + personalizzate) ---
  const techCard = el("div", { class: "card sheet-techniques" });
  techCard.append(el("h2", {}, "Tecniche"));
  for (const t of k.techniques) {
    techCard.append(el("p", {}, techniqueLine("⚡", t)));
  }

  // Tecniche personalizzate (richiesto in chat) - caricate pigre, come
  // il Diario e la Gerarchia.
  if (state.customTechniques === null) {
    loadCustomTechniques();
    techCard.append(el("p", { class: "hint", style: "margin-top:10px;" }, "Caricamento delle tecniche personalizzate..."));
  } else {
    const ct = state.customTechniques;
    if (ct.techniques.length > 0) {
      techCard.append(el("p", { class: "hint", style: "margin-top:10px;font-weight:600;" }, "Personalizzate:"));
      for (const t of ct.techniques) {
        techCard.append(el("p", {}, techniqueLine("✨", t)));
      }
    }
    techCard.append(el("p", { class: "hint", style: "margin-top:8px;" }, `Slot tecnica personalizzata: ${ct.slots_used}/${ct.slots_total}`));

    if (ct.slots_used < ct.slots_total) {
      if (ct.allowed_elements.length === 0) {
        techCard.append(el("p", { class: "hint" }, "Nessun elemento ammesso al momento (serve un'armatura con tecniche riconosciute, o una Provenienza con affinità)."));
      } else {
        const nameInput = el("input", { placeholder: "Nome della tecnica" });
        const elementSelect = el("select", {});
        for (const el_ of ct.allowed_elements) elementSelect.append(el("option", { value: el_ }, el_));
        const roleSelect = el("select", {});
        roleSelect.append(el("option", { value: "no" }, "Offensiva (per attaccare)"));
        roleSelect.append(el("option", { value: "yes" }, "Difensiva (per parare)"));
        const launchInput = el("textarea", { placeholder: "Come si manifesta (opzionale)", rows: "2", style: "width:100%;resize:vertical;" });
        const effectInput = el("textarea", { placeholder: "Che effetto ha (opzionale)", rows: "2", style: "width:100%;resize:vertical;" });
        techCard.append(el("p", { class: "hint", style: "margin-top:10px;" }, "Crea una nuova tecnica personalizzata:"));
        techCard.append(nameInput, elementSelect, roleSelect, launchInput, effectInput);
        techCard.append(el("button", {
          style: "margin-top:6px;",
          onClick: () => {
            if (!nameInput.value.trim()) return showError("Dai un nome alla tecnica.");
            createCustomTechnique(nameInput.value.trim(), elementSelect.value, roleSelect.value === "yes", launchInput.value.trim(), effectInput.value.trim());
          },
        }, "✨ Crea tecnica"));
      }
    }
  }
  grid.append(techCard);

  // --- Diario: solo le voci auto-generate (level up, Sensi,
  // vittorie/sconfitte) - il Background sta ora a parte, sopra ---
  const diaryCard = el("div", { class: "card sheet-diary" });
  diaryCard.append(el("h2", {}, "Diario"));
  if (state.biography === null) {
    diaryCard.append(el("p", { class: "hint" }, "Caricamento..."));
  } else if (state.biography.entries.length === 0) {
    diaryCard.append(el("p", { class: "hint" }, "Il diario si arricchirà da solo man mano che ti alleni e combatti."));
  } else {
    const entriesBox = el("div", { class: "log-box" });
    for (const entry of state.biography.entries) {
      entriesBox.append(el("div", { class: "log-line" }, "• " + entry.entry));
    }
    diaryCard.append(entriesBox);
  }
  grid.append(diaryCard);

  wrap.append(grid);
  return wrap;
}

function renderTrainingPathTab() {
  const wrap = el("div");
  wrap.append(el("h1", {}, "Percorso di Apprendistato"));

  // Un combattimento è in corso - la Prova Finale, o lo scontro
  // leggero della tappa "Fianco a fianco" (richiesto in chat: veri
  // combattimenti interattivi, non testo o dadi narrati) - stessa
  // interfaccia dell'Arena, mostrata qui invece che nella scheda Arena
  // (che gli Apprendisti non hanno).
  if (state.battle) {
    wrap.append(el("h2", {}, state.battle.is_spar ? "🤝 Fianco a fianco" : "⚔ La Prova Finale"));
    appendBattleColumns(wrap);
    const logCard = el("div", { class: "card" });
    logCard.append(el("h2", {}, "Cronaca dello scontro"));
    const logBox = el("div", { class: "log-box" });
    for (const line of state.arenaLog) logBox.append(el("div", { class: "log-line" }, "• " + line));
    logCard.append(logBox);
    wrap.append(logCard);
    return wrap;
  }

  // Il risultato della Prova Finale, appena conclusa - mostrato a
  // parte prima di procedere (richiesto in chat: dev'essere possibile
  // fallire, e il fallimento va raccontato, non solo un numero che
  // cambia) - la cronaca dello scontro appena finito resta in vista.
  // La morte del personaggio (richiesto in chat: un'alternativa vera
  // al fallimento) - mostrata a parte perché a questo punto il
  // personaggio non esiste più nel database, non ha senso ricaricare
  // nient'altro.
  if (state.deathResult) {
    const card = el("div", { class: "card" });
    card.append(el("h2", {}, "💀 Fine del cammino"));
    card.append(el("p", {}, `${state.deathResult.raw_name} non ce l'ha fatta. L'armatura ${state.deathResult.armor_name}, per cui aveva dato tutto se stesso, tornerà a cercare qualcun altro degno di indossarla.`));
    if (state.deathResult.companion_fates) {
      card.append(el("p", { class: "hint", style: "margin-top:10px;" }, "Nel frattempo:"));
      for (const fate of state.deathResult.companion_fates) card.append(el("p", { class: "hint" }, fate));
    }
    card.append(el("button", { onClick: goToKnightsHall }, "Torna alla Sala dei Cavalieri"));
    wrap.append(card);
    return wrap;
  }

  if (state.trialResult) {
    const resultCard = el("div", { class: "card" });
    if (state.trialResult.passed) {
      // Richiesto in chat: "nulla di pomposo e romanzato?" - un vero
      // momento di svolta merita di più di un semplice pulsante
      // "Continua".
      resultCard.append(el("h2", {}, "🏆 Sei un Cavaliere"));
      resultCard.append(el("p", {}, `Il tuo Cosmo esplode in un'ultima, incontenibile fiammata - e quando si placa, non sei più l'aspirante che ha varcato quella soglia settimane fa. ${state.character.armor.name}, per cui hai sanguinato e sudato, è finalmente tua da indossare. Non è solo un'armatura: è la prova vivente che ogni singola caduta, ogni fallimento, ogni notte insonne è servita a qualcosa.`));
      resultCard.append(el("p", { class: "hint" }, "Allenamento e Arena sono ora sbloccati."));
      if (state.trialResult.companionFates) {
        resultCard.append(el("p", { class: "hint", style: "margin-top:10px;" }, "Nel frattempo, per i tuoi compagni:"));
        for (const fate of state.trialResult.companionFates) resultCard.append(el("p", { class: "hint" }, fate));
      }
      const logBox = el("div", { class: "log-box" });
      for (const line of state.arenaLog) logBox.append(el("div", { class: "log-line" }, "• " + line));
      resultCard.append(logBox);
      resultCard.append(el("button", { onClick: closeTrialResult }, "⚔ Indossa l'Armatura"));
    } else {
      resultCard.append(el("h2", {}, "Prova Finale non superata"));
      const logBox = el("div", { class: "log-box" });
      for (const line of state.arenaLog) logBox.append(el("div", { class: "log-line" }, "• " + line));
      resultCard.append(logBox);

      // Le alternative al fallimento (richiesto in chat): compaiono
      // ad OGNI fallimento, non solo dopo un certo numero di tentativi
      // - le tre più drastiche chiedono conferma prima di procedere.
      const FATE_CONFIRM_TEXT = {
        retrain: "Rinuncerai a quest'armatura per sempre, e con essa ai tuoi compagni d'addestramento - il loro destino si deciderà insieme al tuo. Confermi?",
        soldier: "Rinuncerai all'armatura per diventare Soldato Semplice - un percorso diverso, ma pur sempre un percorso. Anche i tuoi compagni avranno il loro destino deciso adesso. Confermi?",
        death: "Questa scelta è definitiva: il personaggio smetterà di esistere. Confermi?",
      };
      const FATE_CONFIRM_ACTION = { retrain: retrainForNewArmor, soldier: becomeSoldier, death: killCharacterAfterTrial };

      if (state.confirmingFateChoice) {
        resultCard.append(el("p", { style: "margin-top:10px;" }, FATE_CONFIRM_TEXT[state.confirmingFateChoice]));
        const row = el("div", { class: "row" });
        row.append(el("button", { onClick: FATE_CONFIRM_ACTION[state.confirmingFateChoice] }, "Sì, confermo"));
        row.append(el("button", { class: "secondary", onClick: () => { state.confirmingFateChoice = null; render(); } }, "No, torna indietro"));
        resultCard.append(row);
      } else {
        resultCard.append(el("p", { class: "hint", style: "margin-top:10px;" }, "Non oggi. Cosa vuoi fare adesso?"));
        resultCard.append(el("button", { onClick: retryTrial }, "🔁 Ritenta"));
        resultCard.append(el("button", { class: "secondary", onClick: () => { state.confirmingFateChoice = "retrain"; render(); } }, "🔀 Riaddestrati per un'altra armatura"));
        resultCard.append(el("button", { class: "secondary", onClick: () => { state.confirmingFateChoice = "soldier"; render(); } }, "🎖️ Diventa Soldato Semplice"));
        resultCard.append(el("button", { class: "secondary", onClick: () => { state.confirmingFateChoice = "death"; render(); } }, "💀 Il personaggio muore"));
      }
    }
    wrap.append(resultCard);
    return wrap;
  }

  // Il risultato dello scontro leggero, appena concluso - si avanza
  // comunque (richiesto in chat), ma merita un riscontro chiaro prima
  // di passare alla tappa successiva.
  if (state.sparResult) {
    const resultCard = el("div", { class: "card" });
    resultCard.append(el("h2", {}, state.sparResult.won ? "Hai avuto la meglio" : "Il tuo compagno ha avuto la meglio"));
    resultCard.append(el("p", { class: "hint" }, "Uno scontro di prova, niente di più - fa parte dell'addestramento, non della Prova Finale."));
    const logBox = el("div", { class: "log-box" });
    for (const line of state.arenaLog) logBox.append(el("div", { class: "log-line" }, "• " + line));
    resultCard.append(logBox);
    resultCard.append(el("button", { onClick: closeSparResult }, "Continua"));
    wrap.append(resultCard);
    return wrap;
  }

  if (state.trainingPath === null) {
    loadTrainingPath();
    wrap.append(el("div", { class: "card" }, el("p", { class: "hint" }, "Caricamento del percorso...")));
    return wrap;
  }

  const tp = state.trainingPath;

  // Intestazione sempre visibile (richiesto in chat: prima l'armatura
  // del Maestro e per chi ti stai addestrando non si vedevano mai
  // esplicitamente, solo dentro il testo della prima tappa).
  const infoLine = tp.ready_for_trial
    ? { master: tp.master_name, masterArmor: tp.master_armor_name, yourArmor: tp.your_armor_name, c1: tp.companion1_name, c2: tp.companion2_name, location: tp.location }
    : { master: tp.stage.master_name, masterArmor: tp.stage.master_armor_name, yourArmor: tp.stage.your_armor_name, c1: tp.stage.companion1_name, c2: tp.stage.companion2_name, location: tp.stage.location };
  const infoCard = el("div", { class: "card" });
  infoCard.append(el("p", {}, `🎓 Ti stai addestrando per diventare portatore di `, el("strong", {}, infoLine.yourArmor)));
  infoCard.append(el("p", { class: "hint" }, `Maestro: ${infoLine.master} (${infoLine.masterArmor}) · Compagni: ${infoLine.c1}, ${infoLine.c2}`));
  // Location geografica dell'addestramento (richiesto in chat).
  if (infoLine.location) {
    infoCard.append(el("p", { class: "hint" }, `📍 ${infoLine.location}`));
  }
  wrap.append(infoCard);

  if (tp.ready_for_trial) {
    const trialCard = el("div", { class: "card" });
    trialCard.append(el("h2", {}, "La Prova Finale"));
    trialCard.append(el("p", {}, "Hai completato l'addestramento. Non resta che una cosa: uno scontro vero contro chi ti ha accompagnato fin qui - a volte contro un compagno, a volte (raramente) contro il Maestro stesso, impegnato al massimo."));
    trialCard.append(el("p", { class: "hint" }, "Puoi fallire - in tal caso tornerai a prepararti e potrai riprovare."));
    trialCard.append(el("button", { onClick: startFinalTrial }, "⚔ Affronta la Prova Finale"));
    wrap.append(trialCard);
    return wrap;
  }

  const stage = tp.stage;
  const stageCard = el("div", { class: "card" });
  stageCard.append(el("p", { class: "hint" }, `Tappa ${stage.stage_number} di ${stage.total_stages}`));
  stageCard.append(el("h2", {}, stage.title));
  stageCard.append(el("p", {}, stage.text));

  if (stage.type === "narrative") {
    stageCard.append(el("button", { onClick: advanceTraining }, "Continua"));

  } else if (stage.type === "choice_check") {
    // Scelta + tiro combinati (richiesto in chat: prima era solo un
    // pulsante "Prova" nudo, troppo ripetitivo) - prima si sceglie
    // l'approccio, che determina la statistica del tiro; solo dopo si
    // vede l'esito. Si può fallire, riprovare (anche con un approccio
    // diverso), o accettare il fallimento e andare avanti senza premio.
    if (state.stageAttemptResult) {
      const r = state.stageAttemptResult;
      stageCard.append(el("p", { style: "font-style:italic;margin-top:8px;" }, r.text));
      if (r.success) {
        stageCard.append(el("p", { class: "hint" }, `+1 ${r.stat.toUpperCase()} permanente.`));
        stageCard.append(el("button", { onClick: advanceTraining }, "Continua"));
      } else {
        const btnRow = el("div", { class: "row" });
        btnRow.append(el("button", { onClick: () => { state.stageAttemptResult = null; render(); } }, "Riprova"));
        btnRow.append(el("button", { class: "secondary", onClick: advanceTraining }, "Vai avanti comunque"));
        stageCard.append(btnRow);
      }
    } else {
      stageCard.append(el("p", { class: "hint", style: "margin-top:8px;" }, "Come vuoi affrontarla?"));
      for (const approach of stage.approaches) {
        stageCard.append(el("button", { onClick: () => attemptSkillCheck(approach.index) }, approach.label));
      }
    }

  } else if (stage.type === "choice") {
    if (state.stageChoiceResult) {
      stageCard.append(el("p", { style: "font-style:italic;margin-top:8px;" }, state.stageChoiceResult.text));
      stageCard.append(el("button", { onClick: advanceTraining }, "Continua"));
    } else {
      for (const opt of stage.options) {
        stageCard.append(el("button", { onClick: () => chooseTrainingOption(opt.index) }, opt.label));
      }
    }

  } else if (stage.type === "spar") {
    stageCard.append(el("button", { onClick: startSpar }, "🤝 Inizia lo scontro"));
  }

  wrap.append(stageCard);
  return wrap;
}

function renderTrainingTab() {
  const wrap = el("div");
  wrap.append(el("h1", {}, "Centro Allenamento"));

  // Bloccato per gli Apprendisti (richiesto in chat: ora la scheda
  // resta visibile, ma con un messaggio chiaro sul perché non è
  // ancora accessibile, invece di sparire del tutto dalla barra).
  if (state.character.apprentice_status === "soldier") {
    wrap.append(el("div", { class: "card" },
      el("p", {}, "🔒 Sei un Soldato Semplice - il Centro Allenamento non fa più parte del tuo percorso."),
      el("button", { onClick: () => { state.gameTab = "soldier"; render(); } }, "Vai al tuo Servizio"),
    ));
    return wrap;
  }
  if (!state.character.is_knight) {
    wrap.append(el("div", { class: "card" },
      el("p", {}, "🔒 Sei ancora un Apprendista - ti stai già addestrando, ed è quello il tuo allenamento per ora."),
      el("p", { class: "hint" }, "Il Centro Allenamento si sblocca quando superi la Prova Finale e diventi Cavaliere."),
      el("button", { onClick: () => { state.gameTab = "percorso"; render(); } }, "Vai al tuo Percorso di Apprendistato"),
    ));
    return wrap;
  }
  if (state.character.mission_id) {
    wrap.append(el("div", { class: "card" },
      el("p", {}, "🔒 Sei in missione - l'Allenamento resta chiuso finché non la completi o l'abbandoni."),
    ));
    return wrap;
  }

  const focusOptions = ["Cosmo", "Forza", "Destrezza", "Costituzione", "Tecnica", "Volontà",
                         "Cascata del Sacrificio", "Sparring con i Compagni", "Riposo"];
  const dayNames = ["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"];
  const focusLegend = {
    "Cosmo": "aumenta il Cosmo massimo",
    "Forza": "aumenta Forza",
    "Destrezza": "aumenta Destrezza",
    "Costituzione": "aumenta Costituzione",
    "Tecnica": "aumenta Tecnica",
    "Volontà": "aumenta Volontà",
    "Cascata del Sacrificio": "aumenta Costituzione (allenamento duro: costa più Stamina)",
    "Sparring con i Compagni": "aumenta Forza, Destrezza o Costituzione a caso (rischio infortunio più alto)",
    "Riposo": "recupera Stamina, nessuna crescita",
  };

  const legendCard = el("div", { class: "card" });
  legendCard.append(el("h2", {}, "Cosa allena ogni voce"));
  for (const [focus, desc] of Object.entries(focusLegend)) {
    legendCard.append(el("p", { class: "hint" }, `${focus}: ${desc}`));
  }
  wrap.append(legendCard);

  const scheduleCard = el("div", { class: "card" });
  scheduleCard.append(el("h2", {}, "Programma settimanale"));
  const row = el("div", { class: "row" });
  state.weeklySchedule.forEach((focus, i) => {
    const select = el("select", {});
    for (const opt of focusOptions) {
      const optionEl = el("option", { value: opt }, opt);
      if (opt === focus) optionEl.setAttribute("selected", "selected");
      select.append(optionEl);
    }
    select.addEventListener("change", (e) => { state.weeklySchedule[i] = e.target.value; });
    const col = el("div", {}, el("div", { class: "hint" }, dayNames[i]), select);
    row.append(col);
  });
  scheduleCard.append(row);

  const btnRow = el("div", { class: "row" });
  btnRow.append(el("button", { onClick: () => doTrain("settimana") }, "▶ Avanza Settimana"));
  btnRow.append(el("button", { class: "secondary", onClick: () => doTrain("mese") }, "▶▶ Avanza Mese"));
  scheduleCard.append(btnRow);
  wrap.append(scheduleCard);

  const logCard = el("div", { class: "card" });
  logCard.append(el("h2", {}, "Ultimo avanzamento"));
  const logBox = el("div", { class: "log-box" });
  if (state.trainingLog.length === 0) logBox.append(el("p", { class: "hint" }, "I risultati appariranno qui."));
  for (const line of state.trainingLog) logBox.append(el("div", { class: "log-line" }, "• " + line));
  logCard.append(logBox);
  wrap.append(logCard);

  return wrap;
}

// Una card-galleria di sfondi (richiesto in chat: una per i 5 temi
// elementali, una per le 13 "sedi" di divinità) - stessa logica,
// riusata due volte invece di duplicarla.
function buildBackgroundGalleryCard(title, hint, labelsMap, backgrounds) {
  const card = el("div", { class: "card" });
  card.append(el("h2", {}, title));
  card.append(el("p", { class: "hint" }, hint));
  for (const [key, label] of Object.entries(labelsMap)) {
    const row = el("div", { style: "display:flex;align-items:center;gap:10px;margin-top:10px;" });
    if (backgrounds[key]) {
      row.append(el("img", { src: backgrounds[key], style: "width:60px;height:60px;object-fit:cover;border-radius:6px;flex-shrink:0;" }));
    } else {
      row.append(el("div", { style: "width:60px;height:60px;border:1px dashed var(--border);border-radius:6px;flex-shrink:0;" }));
    }
    const fileInput = el("input", { type: "file", accept: "image/*", style: "display:none;" });
    fileInput.addEventListener("change", (e) => { if (e.target.files[0]) uploadArenaBackground(e.target.files[0], key); });
    const col = el("div", { style: "flex:1;" });
    col.append(el("p", { style: "margin:0 0 4px;" }, label));
    col.append(fileInput);
    col.append(el("button", {
      class: "secondary",
      onClick: () => fileInput.click(),
    }, backgrounds[key] ? "Cambia" : "Carica"));
    row.append(col);
    card.append(row);
  }
  return card;
}

function renderArenaTab() {
  const wrap = el("div");
  wrap.append(el("h1", {}, "Arena del Santuario"));

  // del Centro Allenamento - visibile, ma con un messaggio chiaro).

    return wrap;
  }
  if (!state.character.is_knight) {
    wrap.append(el("div", { class: "card" },
      el("p", {}, "🔒 Sei ancora un Apprendista - l'Arena si sblocca quando superi la Prova Finale."),
      el("button", { onClick: () => { state.gameTab = "percorso"; render(); } }, "Vai al tuo Percorso di Apprendistato"),
    ));
    return wrap;
  }
  // Bloccato mentre una missione è in corso (richiesto in chat: "non

  if (state.character.mission_id) {

  if (!state.battle && !state.opponentCandidates) {

    searchCard.append(el("p", { class: "hint" }, "Scegli la difficoltà dell'avversario:"));

    // Un'unica galleria "per Regno" (richiesto in chat: prima erano
    // due gallerie separate, per elemento e per divinità - ridondanti
    // e confuse) - un'immagine per ciascuno dei 13 Regni, usata quando
    // l'avversario appartiene a quella divinità.
    const k = state.character;

      waitingCard.append(el("button", {
        onClick: () => challengeOpponent(candidate),
      }, `⚔ ${candidate.name} (${candidate.divinity} / ${candidate.faction}, livello ${candidate.armor_level})`));
    }
    waitingCard.append(el("button", {
      class: "secondary",
      onClick: () => searchOpponent(state.lastDifficulty),
    }, "🔄 Cerca altri avversari"));
    waitingCard.append(el("button", { class: "secondary", onClick: () => { state.opponentCandidates = null; render(); } }, "◄ Cambia difficoltà"));
    wrap.append(waitingCard);
  } else {
    appendBattleColumns(wrap);
  }

  const logCard = el("div", { class: "card" });
  logCard.append(el("h2", {}, "Cronaca dello scontro"));
  const logBox = el("div", { class: "log-box" });
  if (state.arenaLog.length === 0) logBox.append(el("p", { class: "hint" }, "Cerca un avversario per iniziare."));
  for (const line of state.arenaLog) logBox.append(el("div", { class: "log-line" }, "• " + line));
  logCard.append(logBox);
  wrap.append(logCard);

  return wrap;
}

// Il pannello di combattimento vero e proprio (mappa, tecniche,
// reazioni) - estratto in una funzione a sé (richiesto in chat: la
// Prova Finale ora è un vero combattimento, non un tiro di dado
// narrato, e riusa esattamente questa stessa interfaccia dell'Arena,
// invece di duplicarla) - riceve il contenitore a cui aggiungere le
// colonne.
async function loadSoldierStatus() {
  try {
    state.soldierStatus = await api(`/characters/${state.characterId}/soldier`);
  } catch (e) {
    showError(e.message);
    state.soldierStatus = { activities: [], denaro: 0 };
  }
  render();
}

async function doSoldierActivity(activityKey) {
  try {
    state.soldierActivityResult = await api(`/characters/${state.characterId}/soldier/activity`, {
      method: "POST",
      body: JSON.stringify({ activity_key: activityKey }),
    });
    state.character.denaro = state.soldierActivityResult.denaro_total;
    render();
  } catch (e) {
    showError(e.message);
  }
}

function renderMissionsTab() {

  // stessa interfaccia di battaglia già usata per la Prova Finale e
  // l'Arena.

    wrap.append(el("h2", {}, "⚔ Scontro"));

    logCard.append(logBox);
    wrap.append(logCard);
    return wrap;
  }

  // Il risultato di una missione appena completata via duello
  // (richiesto in chat: prima non arrivava nessun segnale al
  // frontend).
  if (state.missionEndingResult) {
    const card = el("div", { class: "card" });
    card.append(el("h2", {}, "🏆 Missione completata!"));
    if (state.missionEndingResult.text) {
      card.append(el("p", {}, state.missionEndingResult.text));
    }

    card.append(el("button", { onClick: () => { state.missionEndingResult = null; render(); } }, "Continua"));

    return wrap;
  }

  if (state.missionStatus === null) {
    loadMissionStatus();
    wrap.append(el("div", { class: "card" }, el("p", { class: "hint" }, "Caricamento del percorso...")));
    return wrap;
  }

  const ms = state.missionStatus;

  if (!ms.active) {
    const card1 = el("div", { class: "card" });
    card1.append(el("h2", {}, "La Scalata delle Dodici Case"));
    card1.append(el("p", {}, "Affronta in ordine i dodici Guardiani del Santuario - convincili a lasciarti passare senza combattere, o sfidali a duello. Fedele al canone: l'ordine è sempre lo stesso."));
    card1.append(el("button", { onClick: () => startMission("dodici_case") }, "⛩️ Inizia la Scalata"));
    wrap.append(card1);

    const card2 = el("div", { class: "card" });
    card2.append(el("h2", {}, "Le Colonne dei Sette Mari"));
    card2.append(el("p", {}, "Infiltrati nel Regno di Poseidone. Le tue scelte portano DAVVERO a strade diverse - e a finali diversi."));
    card2.append(el("button", { onClick: () => startMission("colonne_sette_mari") }, "🌊 Inizia Le Colonne"));

      card.append(el("p", { style: "font-style:italic;margin-top:8px;" }, state.missionChoiceResult.text));
      card.append(el("button", { onClick: () => { state.missionChoiceResult = null; state.missionStatus = null; render(); } }, "Continua"));
    } else {
      for (const opt of node.options) {

      }

  } else if (node.type === "skill_check") {
    card.append(el("p", {}, node.text));
    if (state.missionActionResult) {
      const r = state.missionActionResult;
      card.append(el("p", { style: "font-style:italic;margin-top:8px;" }, r.text));
      card.append(el("button", { onClick: () => { state.missionActionResult = null; state.missionStatus = null; render(); } }, "Continua"));
