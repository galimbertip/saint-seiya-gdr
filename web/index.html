<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saint Seiya: Sacro Imperio</title>
<style>
  /* Un solo carattere per l'identità visiva del gioco (richiesto in
     chat: passaggio grafico) - Cinzel per i titoli, ispirato alle
     iscrizioni romane e alle mappe celesti, mai usato per il corpo
     del testo. Il corpo resta su un carattere di sistema, per
     restare leggibile e veloce anche se il font esterno non carica
     (fallback su serif esplicito). Un solo font esterno, non due, per
     limitare la dipendenza da un servizio esterno. */
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap');
  :root {
    --bg-darkest: #0A0D16;
    --bg-panel: #131A2C;
    --bg-panel-alt: #1C2540;
    --bg-panel-raised: #232E4C;
    --border: #2A3550;
    --border-bright: #3D4A6B;
    --gold: #C9A536;
    --gold-dim: #8A7229;
    --cosmo-blue: #4B93DE;
    --cosmo-blue-dim: #245A7C;
    --text-primary: #E9E4D6;
    --text-secondary: #838BA3;
    --danger: #C0392B;
    --success: #3FA96A;
    --font-display: "Cinzel", Georgia, "Times New Roman", serif;
    --font-body: "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg-darkest);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(75,147,222,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(201,165,54,0.06), transparent 55%);
    background-attachment: fixed;
    color: var(--text-primary);
    font-family: var(--font-body);
    margin: 0;
    padding: 24px;
  }
  h1, h2, h3 {
    margin: 0 0 12px 0;
    font-family: var(--font-display);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  h1 {
    color: var(--gold);
    font-size: 26px;
    padding-bottom: 10px;
    border-bottom: none;
    background-image: linear-gradient(90deg, var(--gold-dim) 0%, transparent 55%);
    background-repeat: no-repeat;
    background-position: bottom left;
    background-size: 100% 1px;
  }
  h2 { color: var(--cosmo-blue); font-size: 16px; letter-spacing: 0.03em; }
  h3 { color: var(--text-primary); font-size: 14px; font-weight: 600; }
  .hint { color: var(--text-secondary); font-size: 13px; }
  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .tone-pill {
    background: var(--bg-panel-alt);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-primary);
    transition: border-color 0.15s, background 0.15s;
  }
  .tone-pill:hover { border-color: var(--gold-dim); }
  .tone-pill-active {
    background: var(--gold);
    color: #1a1a1a;
    border-color: var(--gold);
    font-weight: 700;
  }
  button {
    background: var(--gold-dim);
    color: var(--bg-darkest);
    border: none;
    border-radius: 5px;
    padding: 10px 16px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    margin: 4px 4px 4px 0;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover { background: var(--gold); }
  button:active { transform: translateY(1px); }
  button:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; transform: none; }
  button.secondary {
    background: transparent;
    color: var(--cosmo-blue);
    border: 1px solid var(--cosmo-blue-dim);
  }
  button.secondary:hover { background: var(--bg-panel-alt); }
  button:focus-visible, .tone-pill:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--cosmo-blue);
    outline-offset: 2px;
  }
  input, select {
    background: var(--bg-panel-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text-primary);
    font-size: 14px;
    width: 100%;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .bar-wrap {
    background: var(--bg-panel-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    height: 20px;
    position: relative;
    overflow: hidden;
    margin: 4px 0 10px 0;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cosmo-blue-dim), var(--cosmo-blue));
    transition: width 0.35s ease-out;
  }
  .bar-fill.stamina { background: linear-gradient(90deg, var(--gold-dim), var(--gold)); }
  .bar-fill.vita { background: linear-gradient(90deg, #7A2318, var(--danger)); }
  .bar-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    text-shadow: 0 0 3px #000;
  }
  .stats-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat-chip {
    background: var(--bg-panel-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    text-align: center;
    min-width: 80px;
  }
  .stat-chip .value { font-size: 20px; font-weight: 700; font-family: var(--font-display); }
  .stat-chip .label { font-size: 11px; color: var(--text-secondary); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--gold); font-weight: 600; letter-spacing: 0.02em; }
  tr.selectable { cursor: pointer; }
  tr.selectable:hover { background: var(--bg-panel-alt); }
  tr.selected { background: var(--cosmo-blue-dim); }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: transparent;
    color: var(--text-secondary);
    border: none;
    border-bottom: 3px solid transparent;
    border-radius: 0;
    padding: 10px 16px;
    margin: 0;
    font-family: var(--font-body);
  }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 700; }
  .log-line { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .log-box { max-height: 300px; overflow-y: auto; }
  .status-bar {
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    margin-bottom: 16px;
  }
  .status-bar .calendar { color: var(--cosmo-blue); font-weight: 600; white-space: nowrap; font-family: var(--font-display); }
  .status-bar .mini-bar { width: 240px; }
  .status-bar .mini-bar .bar-wrap { height: 26px; margin: 0; }
  .status-bar .mini-bar .bar-label { font-size: 13px; font-weight: 700; }
  .hidden { display: none !important; }
  #error-banner {
    background: var(--danger);
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* Un lampo di Cosmo quando un numero cambia davvero (danno subito,
     guadagno di risorsa) - richiesto in chat, "curiamo la grafica":
     un solo movimento mirato, non un'animazione su ogni elemento. Si
     applica aggiungendo/rimuovendo questa classe via JS quando serve. */
  @keyframes cosmo-flash {
    0% { box-shadow: 0 0 0 0 rgba(75,147,222,0.55); }
    100% { box-shadow: 0 0 0 8px rgba(75,147,222,0); }
  }
  .cosmo-flash { animation: cosmo-flash 0.5s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .bar-fill { transition: none; }
    .cosmo-flash { animation: none; }
  }
  /* Disposizione dell'Arena: pannello combattente sinistro, mappa al
     centro, pannello combattente destro - pensata per estendersi in
     futuro a più cavalieri per lato (richiesto in chat). Su schermi
     stretti i pannelli scendono sotto la mappa invece di schiacciarsi. */
  .arena-columns { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .fighter-panel {
    flex: 1 1 220px;
    min-width: 220px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .fighter-panel.opponent-panel button { opacity: 0.55; cursor: not-allowed; }
  .arena-map-column { flex: 2 1 340px; min-width: 300px; }
  /* Scheda Cavaliere/Home come "carta d'identità" (richiesta in chat,
     schizzo fornito): immagine grande a sinistra, a destra impilati
     Dati Anagrafici / BG Personaggio / Statistiche+Progressione;
     sotto, Tecniche e Diario affiancati. */
  .sheet-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "image identity"
      "image background"
      "image stats"
      "techniques diary";
    gap: 16px;
    align-items: stretch;
  }
  .sheet-image { grid-area: image; }
  .sheet-identity { grid-area: identity; }
  .sheet-background { grid-area: background; }
  .sheet-stats { grid-area: stats; }
  .sheet-techniques { grid-area: techniques; }
  .sheet-diary { grid-area: diary; }
  /* --- Schermi stretti (smartphone) --- */
  @media (max-width: 640px) {
    body { padding: 12px; }
    h1 { font-size: 21px; }
    h2 { font-size: 15px; }
    .card { padding: 12px 14px; }
    button { padding: 10px 14px; font-size: 13px; }
    /* La barra di stato: da riga unica (calendario + 2 barre da 240px,
       non ci stanno in 360px di schermo) a colonna impilata, ogni
       elemento largo quanto lo schermo - segnalato in chat, prima
       nessuno l'aveva ancora provata da telefono. */
    .status-bar { flex-direction: column; align-items: stretch; gap: 10px; }
    .status-bar .calendar { white-space: normal; text-align: center; }
    .status-bar .mini-bar { width: 100%; }
    .stat-chip { min-width: 64px; padding: 8px 10px; }
    .stat-chip .value { font-size: 17px; }
    .tab-btn { padding: 8px 10px; font-size: 13px; }
    /* Le tabelle (elenco partite, elenco armature) restano leggibili:
       invece di schiacciarsi o sforare lo schermo, scorrono in
       orizzontale con un dito - vedi .table-scroll nel markup. */
    table { font-size: 12px; }
    th, td { padding: 5px 6px; }
    /* La carta d'identità: da due colonne a una sola, impilata
       nell'ordine naturale di lettura. */
    .sheet-grid {
      grid-template-columns: 1fr;
      grid-template-areas: "image" "identity" "background" "stats" "techniques" "diary";
    }
  }
</style>
</head>
<body>
<div id="error-banner" class="hidden"></div>
<div id="app"></div>
<script>
const $ = (sel) => document.querySelector(sel);
// Potenza della Difesa Base generica (richiesto in chat: "Difesa Base
// + tecniche di difesa", stessa struttura dell'Attacco Base) - deve
// combaciare con DEFAULT_DEFENSE_POWER lato backend.
const DEFAULT_DEFENSE_POWER = 10;
// Il Cosmo come risorsa per le tecniche (richiesto in chat, le tre
// barre) - stessa formula del backend (core/arena_manager.py,
// technique_cosmo_cost), per mostrare il costo e disabilitare i
// pulsanti che non ci si può permettere PRIMA di provare a inviarli,
// non solo dopo un rifiuto del server.
const TECHNIQUE_COSMO_COST_DIVISOR = 10;
function techniqueCosmoCost(name, power) {
  if (name === "Attacco Base" || !power) return 0;
  return Math.max(1, Math.floor(power / TECHNIQUE_COSMO_COST_DIVISOR));
}
const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "onClick") node.addEventListener("click", v);
    // onInput/onKeyDown in stile camelCase, come onClick (corretto in
    // chat: "oninput"/"onkeydown" minuscoli finivano nel ramo else,
    // trattati come un attributo HTML testuale invece che un vero
    // gestore - una funzione passata lì non veniva mai collegata
    // davvero, il campo di testo della Taverna non si aggiornava mai).
    else if (k === "onInput") node.addEventListener("input", v);
    else if (k === "onKeyDown") node.addEventListener("keydown", v);
    else if (k === "class") node.className = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    node.append(c instanceof Node ? c : document.createTextNode(c));
  }
  return node;
};
// Toglie i numeri "da regolamento" (tiro vs CA, dado naturale) E le
// icone usate come segnaposto visivo negli elenchi, lasciando una
// frase pulita da poter leggere come prosa - deciso in chat: la prima
// versione toglieva solo i numeri ma restava comunque un elenco
// puntato, non un vero racconto (segnalato in chat, corretto qui). Il
// danno inflitto (— Danno: N) resta: interessa a chi gioca, non è un
// dettaglio da tavolo di regole.
function stripTechnicalDetails(line) {
  return line
    .replace(/\s*\(\d+\s*vs\s*CA\s*\d+\)/g, "")
    .replace(/\s*\(\d+\s*naturale\)/g, "")
    .replace(/^[⚔🎲⚠️☠️🏆💀✨⚡🎉🌟]+\s*/u, "")
    .trim();
}
// --- Stato globale della pagina (nessun framework, solo un oggetto e un render()) ---
const state = {
  screen: "startPage",       // startPage | loadGame | creation | game
  appVersion: null,         // recuperata all'avvio da GET / (fonte di verità: core/version.py)
  characters: [],
  characterId: null,
  character: null,          // payload completo dell'ultima GET /characters/{id}
  gameTab: "sheet",         // sheet | training | arena
  armors: [],
  weeklySchedule: [],
  battle: null,             // battle_state, o null fuori combattimento
  opponentCandidates: null, // sala d'attesa: 5 avversari tra cui scegliere, o null
  lastDifficulty: null,     // l'ultima difficoltà cercata, per "Cerca altri avversari" senza rifare la scelta
  creationMode: null,       // null | "detailed" - la scelta nella creazione personaggio
  roster: null,              // la Gerarchia (tutte le armature + chi le occupa), null finché non caricata
  chronicle: null,           // la Cronaca del Mondo (eventi accaduti ai PNG nel tempo), null finché non caricata
  tavernRealms: null,        // le 13 Taverne separate per regno (richiesto in chat), null finché non caricate
  tavernDivinity: null,      // in quale Taverna/regno sei ora, null se sei ancora alla scelta
  tavernRealmRoster: null,   // la mappa di QUESTA Taverna (taverniere + tavoli), null finché non caricata
  tavernPlayerPosition: "door", // in quale zona ti trovi ora: "door" | "bar" | "table-N" | null se in mezzo alla sala
  tavernPlayerX: 5,          // le tue coordinate VERE sulla mappa (richiesto in chat: movimento libero come l'Arena, non caselle)
  tavernPlayerY: 9.3,
  tavernArmorName: null,     // con quale armatura/PNG stai parlando ora, null se nessuna
  tavernConversation: null,  // la conversazione corrente (nome, affinità, messaggi), null finché non caricata
  tavernSelectedTone: "neutro", // il tono/atteggiamento scelto (richiesto in chat, stile Football Manager) - si applica al prossimo messaggio, sia da pulsante che da testo libero
  defenseScreen: null,        // null | "team_select" | "battle" - la Difesa a Ondate ha un flusso proprio, separato dalle altre missioni (lo stato di battaglia va e viene col client, come l'Arena)
  defenseTeamCandidates: null,
  defenseTeamMode: "random",  // "random" | "selected"
  defenseSelectedAllies: [],  // array di armor_name, max 2
  defenseBattle: null,        // lo stato della battaglia (units, initiative_order, ecc.)
  defenseTargetMode: "singolo", // "singolo" | "area" - scelto prima di attaccare
  defenseSelectedTargetId: null, // il bersaglio scelto per il prossimo attacco (solo modalità singolo)
  defenseResult: null,        // { reward, character } quando la battaglia finisce
  tavernInput: "",           // il testo che stai scrivendo
  tavernMissionOffer: null,  // l'offerta di missione appena arrivata dal PNG (richiesto in chat), null se nessuna
  biography: null,           // il Diario del personaggio corrente (abbozzo + voci), null finché non caricato
  customTechniques: null,    // le tecniche personalizzate del personaggio corrente (+ slot), null finché non caricate
  showCounterPicker: false,  // sta scegliendo la tecnica per il Contrattacco?
  showDefensePicker: false,  // sta scegliendo la tecnica per la Difesa? (richiesto in chat: prima era automatica)
  institutionalNpcs: null,   // le figure istituzionali del mondo (statiche, non legate a un personaggio), null finché non caricate
  scoutedAllies: null,       // richiesto in chat, staff "Osservatore": PNG con affinità già promettente in Taverna, null finché non caricati
  divinityNpcs: null,        // le Divinità del mondo (richiesto in chat: gerarchia vera, il vertice di ogni fazione), null finché non caricate
  editingBackground: false,  // sta modificando il background nella Scheda Cavaliere?
  trainingPath: null,        // lo stato del percorso di Apprendistato del personaggio corrente, null finché non caricato
  trialResult: null,         // il risultato appena arrivato della Prova Finale, da mostrare prima di procedere
  sparResult: null,          // il risultato appena arrivato dello scontro leggero d'allenamento, da mostrare prima di procedere
  stageAttemptResult: null,  // il risultato appena arrivato di una prova a dado di una tappa, da mostrare prima di procedere
  stageChoiceResult: null,   // l'esito appena arrivato di una scelta di una tappa, da mostrare prima di procedere
  missionStatus: null,       // lo stato della missione in corso (o {active:false}), null finché non caricato
  missionActionResult: null, // l'esito di un tentativo di persuasione o di una prova a dado di un nodo, da mostrare prima di procedere
  missionChoiceResult: null, // l'esito di una scelta di un nodo delle Colonne, da mostrare prima di procedere
  missionEndingResult: null, // il risultato di missione completata/fallita via duello, da mostrare prima di tornare all elenco
  confirmingAbandon: false,  // sta confermando l'abbandono di una missione?
  confirmingFateChoice: null, // sta confermando una delle alternative al fallimento della Prova Finale?
  deathResult: null,         // l'ultimo ricordo del personaggio appena morto (richiesto in chat), prima di tornare alla Sala dei Cavalieri
  soldierStatus: null,       // lo stato del Soldato Semplice (attività disponibili), null finché non caricato
  soldierActivityResult: null, // l'esito appena arrivato di un'attività da Soldato, da mostrare prima di procedere
  geoOrigins: null,          // albero Continente -> Macrozona -> Nazione per la Provenienza, null finché non caricato
  showTutorial: false,       // il tutorial iniziale è aperto in questo momento?
  tutorialStep: 0,           // a che passo del tutorial siamo
  trainingLog: [],
  arenaLog: [],
  meditationStatus: null,   // richiesto in chat, mini-gioco ricorrente: {available, minutes_until_next, sequence_length}, null finché non caricato
  meditationSequence: null, // la sequenza vera da ricordare (richiesta al server all'inizio del tentativo)
  meditationPhase: "idle",  // "idle" | "showing" | "input" | "result" - a che punto siamo del tentativo in corso
  meditationInput: [],      // quello che il giocatore ha cliccato finora in questo tentativo
  meditationResult: null,   // { success, reward } dell'ultimo tentativo appena concluso
};
// --- Chiamate API: stesso indirizzo della pagina, nessun URL da configurare ---
async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `Errore HTTP ${res.status}`);
  }
  return res.json();
}
function showError(msg) {
  const banner = $("#error-banner");
  banner.textContent = msg;
  banner.classList.remove("hidden");
  setTimeout(() => banner.classList.add("hidden"), 6000);
}
// --- Pagina Iniziale (Nuova/Carica Partita) e schermata "Carica Partita" ---
// Rinominata da "Home" in chat: la vera Home (una volta dentro al
// gioco) sarà la Scheda Cavaliere - questa è solo la porta d'ingresso
// prima di aver caricato un personaggio, concettualmente diversa.
async function loadStartPage() {
  state.screen = "startPage";
  try {
    state.characters = await api("/characters");
  } catch (e) {
    showError(e.message);
    state.characters = [];
  }
  render();
}
async function loadStartScreen() {
  // "Carica Partita": l'elenco dei salvataggi tra cui scegliere -
  // usata sia dal pulsante omonimo in home, sia per tornare qui dopo
  // aver lasciato una partita in corso (più naturale che tornare alla
  // home vera e propria, visto che si era già dentro al gioco).
  state.screen = "loadGame";
  try {
    state.characters = await api("/characters");
  } catch (e) {
    showError(e.message);
    state.characters = [];
  }
  render();
}
async function selectCharacter(id) {
  state.characterId = id;
  state.biography = null;  // il diario del personaggio precedente non deve restare in vista
  state.customTechniques = null;  // idem per le tecniche personalizzate
  state.editingBackground = false;  // idem per una modifica del background lasciata a metà
  state.trainingPath = null;  // idem per il percorso di Apprendistato
  state.trialResult = null;
  state.sparResult = null;
  state.stageAttemptResult = null;
  state.stageChoiceResult = null;
  state.missionStatus = null;
  state.missionActionResult = null;
  state.missionChoiceResult = null;
  state.missionEndingResult = null;
  state.confirmingAbandon = false;
  state.confirmingFateChoice = null;
  state.deathResult = null;
  state.soldierStatus = null;
  state.soldierActivityResult = null;
  state.tavernRealms = null;
  state.tavernDivinity = null;
  state.tavernRealmRoster = null;
  state.tavernPlayerPosition = "door";
  state.tavernPlayerX = 5;
  state.tavernPlayerY = 9.3;
  state.tavernArmorName = null;
  state.tavernConversation = null;
  state.tavernInput = "";
  state.tavernSelectedTone = "neutro";
  state.tavernMissionOffer = null;
  state.scoutedAllies = null;
  state.meditationStatus = null;
  state.meditationSequence = null;
  state.meditationPhase = "idle";
  state.meditationInput = [];
  state.meditationResult = null;
  state.defenseScreen = null;
  state.defenseTeamCandidates = null;
  state.defenseSelectedAllies = [];
  state.defenseBattle = null;
  state.defenseSelectedTargetId = null;
  state.defenseResult = null;
  await refreshCharacter();
  state.screen = "game";
  state.gameTab = "sheet";
  maybeShowTutorial();

function renderTutorialOverlay() {

  const step = TUTORIAL_STEPS[state.tutorialStep];
  const overlay = el("div", {
    style: "position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;",
  });
  const box = el("div", { class: "card", style: "max-width:420px;width:100%;" });
  box.append(el("p", { class: "hint" }, `Passo ${state.tutorialStep + 1} di ${TUTORIAL_STEPS.length}`));
  box.append(el("h2", {}, step.title));
  box.append(el("p", {}, step.body));
  const btnRow = el("div", { class: "row", style: "margin-top:16px;justify-content:space-between;" });
  if (state.tutorialStep > 0) {
    btnRow.append(el("button", { class: "secondary", onClick: () => { state.tutorialStep--; render(); } }, "◄ Indietro"));

  if (state.tutorialStep < TUTORIAL_STEPS.length - 1) {

  } else {
    btnRow.append(el("button", { onClick: closeTutorial }, "Ho capito, si comincia!"));

  box.append(btnRow);
  box.append(el("button", { class: "secondary", style: "margin-top:10px;width:100%;", onClick: closeTutorial }, "Salta tutorial"));
  overlay.append(box);
  return overlay;
}

const RANDOM_NAMES_MALE = ["Kenji", "Marco", "Aleksei", "Diego", "Chen", "Andrea", "Erik", "Rafael", "Luca", "Dmitri"];

// Pesca una nazione a caso dall'intero albero geografico (state.geoOrigins,
// caricato da GET /geo-origins) - usata dal Personaggio Casuale.
function randomCountryFromGeo() {
  const continents = Object.values(state.geoOrigins || {});
  if (continents.length === 0) return "";
  const zones = Object.values(randomFrom(continents));
  return randomFrom(randomFrom(zones).countries);
}
function randomFrom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}
async function createRandomCharacter() {

  const armor = randomFrom(state.armors);

  // indipendenti, capitava un "Sofia" con sesso "Maschio") - il nome
  // arriva da un elenco coerente con il sesso appena scelto.
  const gender = randomFrom(RANDOM_GENDERS);
  const namePool = gender === "Femmina" ? RANDOM_NAMES_FEMALE : RANDOM_NAMES_MALE;
  const details = {
    surname: randomFrom(RANDOM_SURNAMES),
    age: 14 + Math.floor(Math.random() * 9),  // 14-22, l'età tipica di un cavaliere
    gender,

}

async function reactToAttack(action, technique) {

      body.counter_technique_name = technique.name;
      body.counter_technique_power = technique.power;
      body.counter_technique_type = technique.tech_type || null;
      body.counter_technique_launch_desc = technique.launch_desc || null;
      body.counter_technique_effect_desc = technique.effect_desc || null;
    }
    if (action === "difenditi" && technique) {
      // La difesa è ora una vera scelta del giocatore (richiesto in
      // chat: "Difesa Base + tecniche di difesa", stessa struttura
      // dell'attacco) - non più decisa in automatico dal sistema.
      body.defense_technique_name = technique.name;
      body.defense_technique_power = technique.power;
      body.defense_technique_type = technique.tech_type || null;
      body.defense_technique_launch_desc = technique.launch_desc || null;
      body.defense_technique_effect_desc = technique.effect_desc || null;
    }
    const result = await api(`/characters/${state.characterId}/arena/react`, {
      method: "POST",
      body: JSON.stringify(body),
    });
    applyArenaResult(result);
  } catch (e) {

function applyArenaResult(result) {
  // Riconosce se lo scontro appena concluso era la Prova Finale o uno
  // scontro leggero d'allenamento (richiesto in chat: ora sono veri
  // combattimenti, non tiri di dado - vanno gestiti diversamente da
  // una normale vittoria/sconfitta in Arena) guardando i flag PRIMA
  // che state.battle venga sovrascritto.
  const wasTrial = state.battle && state.battle.is_trial;
  const wasSpar = state.battle && state.battle.is_spar;
  const wasMission = state.battle && state.battle.is_mission;
  state.character = result.character;
  state.arenaLog = [...state.arenaLog, ...result.log];
  state.battle = result.fight_over ? null : result.battle_state;
  state.showCounterPicker = false;  // ogni round risolto riparte pulito
  state.showDefensePicker = false;
  if (result.fight_over) {
    // Uno scontro concluso aggiunge sempre una voce al diario - stesso
    // fix di doTrain, invalido la cache per ricaricarla alla prossima
    // apertura della Scheda Cavaliere.
    state.biography = null;
    if (wasTrial) {
      // Le alternative al fallimento (richiesto in chat) - non si
      // resetta più da sola la tappa di ripreparazione: la scelta
      // (ritenta, riaddestrati altrove, diventa Soldato Semplice,
      // muori) spetta ora al giocatore, gestita dentro
      // renderTrainingPathTab finché sceglie - trainingPath non si
      // ricarica ancora qui, solo dopo la scelta.
      state.trialResult = { passed: result.won, companionFates: result.companion_fates || null };
    } else if (wasSpar) {
      // Lo scontro leggero avanza comunque, vinca o perda (richiesto
      // in chat) - ma merita comunque un riscontro chiaro prima di
      // tornare al percorso, non solo un messaggio di passaggio.
      state.sparResult = { won: result.won };
      state.trainingPath = null;
    } else if (wasMission) {
      // Un duello delle Missioni concluso (richiesto in chat) - se ha
      // completato l'intera missione, mostra la ricompensa/il finale;
      // altrimenti si torna semplicemente allo stato della missione
      // (Casa/nodo successivo se vinto, la stessa se perso - si
      // sceglierà se ritentare o abbandonare).
      if (result.mission_completed) {
        state.missionEndingResult = { text: result.mission_ending_text, tournamentChampion: result.tournament_champion };
      } else {
        state.arenaLog.push(result.won ? "Hai vinto lo scontro." : "Sei stato sconfitto - puoi ritentare, o abbandonare la missione.");
      }
      state.missionStatus = null;
    } else {
      state.arenaLog.push(result.won ? "🏆 Vittoria!" : "💀 Sconfitta...");
    }
  }
  render();
}

function renderGameScreen() {
  const wrap = el("div");

  const statusBar = el("div", { class: "status-bar" });

  wrap.append(statusBar);
  // --- Tabs ---
  const tabs = el("div", { class: "tabs" });
  // Finché è Apprendista (richiesto in chat), Allenamento e Arena sono
  // sostituiti da un'unica scheda "Percorso" - non ha senso mostrarli
  // se sono comunque bloccati lato server.
  const isSoldier = !k.is_knight && k.apprentice_status === "soldier";
  const tabDefs = k.is_knight
    ? [["sheet", "Scheda Cavaliere"], ["today", "Oggi"], ["training", "Centro Allenamento"], ["arena", "Arena del Santuario"], ["missions", "Missioni"], ["meditation", "Meditazione"], ["hierarchy", "Gerarchia"], ["chronicle", "Cronaca del Mondo"], ["tavern", "Taverna"]]
    : isSoldier
    ? [["sheet", "Scheda Cavaliere"], ["soldier", "Servizio"], ["hierarchy", "Gerarchia"], ["chronicle", "Cronaca del Mondo"], ["tavern", "Taverna"]]
    : [["sheet", "Scheda Cavaliere"], ["percorso", "Percorso"], ["training", "Centro Allenamento"], ["arena", "Arena del Santuario"], ["hierarchy", "Gerarchia"], ["chronicle", "Cronaca del Mondo"], ["tavern", "Taverna"]];
  // Allenamento e Arena ora restano visibili anche da Apprendista
  // (richiesto in chat: prima sparivano del tutto dalla barra, e senza
  // vederle il tutorial che le nomina risultava incomprensibile) - il
  // blocco vero avviene dentro le due schede stesse, con un messaggio
  // che spiega perché.
  for (const [key, label] of tabDefs) {
    tabs.append(el("button", {
      class: "tab-btn" + (state.gameTab === key ? " active" : ""),
      onClick: () => {
        // Il log è condiviso con Allenamento/Missioni (richiesto in
        // chat: prima capitava di vedere ancora il resoconto di un
        // duello d'addestramento entrando in Arena) - lo si pulisce
        // solo entrando in Arena dall'esterno, e solo se non c'è
        // davvero un combattimento in Arena in corso da riprendere.
        if (key === "arena" && state.gameTab !== "arena" && !state.battle) {
          state.arenaLog = [];
        }
        state.gameTab = key;
        render();
      },
    }, label));
  }
  // Riapre il tutorial in ogni momento (richiesto in chat), senza
  // toccare il flag "già visto" - resta sempre disponibile a chi vuole
  // rivederlo, anche dopo averlo già chiuso una volta.
  tabs.append(el("button", {
    class: "tab-btn", title: "Rivedi il tutorial",
    onClick: () => { state.showTutorial = true; state.tutorialStep = 0; render(); },
  }, "❓"));
  wrap.append(tabs);
  if (state.gameTab === "sheet") wrap.append(renderSheetTab());
  else if (state.gameTab === "today") wrap.append(renderTodayTab());
  else if (state.gameTab === "meditation") wrap.append(renderMeditationTab());
  else if (state.gameTab === "percorso") wrap.append(renderTrainingPathTab());
  else if (state.gameTab === "training") wrap.append(renderTrainingTab());
  else if (state.gameTab === "arena") wrap.append(renderArenaTab());
  else if (state.gameTab === "missions") wrap.append(renderMissionsTab());
  else if (state.gameTab === "soldier") wrap.append(renderSoldierTab());
  else if (state.gameTab === "chronicle") wrap.append(renderChronicleTab());
  else if (state.gameTab === "tavern") wrap.append(renderTavernTab());
  else if (state.gameTab === "hierarchy") wrap.append(renderHierarchyTab());
  wrap.append(el("button", { class: "secondary", onClick: goToKnightsHall }, "◄ Torna alla Sala dei Cavalieri"));
  return wrap;
}

async function sendTavernMessage(overrideText, intent) {
  // overrideText/intent: capacità rimasta per compatibilità, ma non
  // più usata da nessun pulsante (richiesto in chat: "vorrei lasciare
  // scrivere al pg la frase" - i vecchi pulsanti che inserivano una
  // frase fissa sono stati rimossi, il testo libero passa ora dal
  // classificatore di intenti in core.intent_classifier, che capisce
  // la stragrande maggioranza delle frasi senza bisogno di scorciatoie).
  const testo = (overrideText !== undefined ? overrideText : state.tavernInput).trim();
  if (!testo || !state.tavernConversation) return;
  if (overrideText === undefined) state.tavernInput = "";
  // Il messaggio del giocatore compare subito, senza aspettare la
  // risposta - la Taverna è a costo zero (richiesto in chat) quindi
  // la risposta arriva comunque in fretta, ma reagire subito aiuta a
  // sentirla come una vera conversazione.
  state.tavernConversation.messages.push({ speaker: "player", text: testo });
  render();
  try {
    const result = await api(`/characters/${state.characterId}/tavern/message`, {
      method: "POST",
      body: JSON.stringify({ armor_name: state.tavernArmorName, text: testo, intent: intent || null, tone: state.tavernSelectedTone }),
    });
    state.tavernConversation.messages.push({ speaker: "npc", text: result.response });
    state.tavernConversation.affinity = result.affinity;
    state.tavernSelectedTone = "neutro";  // il tono si sceglie di nuovo ad ogni messaggio, come in FM
    // Il reclutamento per missione (richiesto in chat): il PNG offre
    // da solo, quando la fiducia costruita supera la soglia - non
    // solo se glielo chiedi tu esplicitamente.
    if (result.mission_offer) {
      state.tavernConversation.messages.push({ speaker: "npc", text: result.mission_offer_text });
      state.tavernMissionOffer = result.mission_offer;
    }
  } catch (e) {
    showError(e.message);
  }
  render();
}

const TAVERN_RELATION_LABELS = {
  alleata: "🤝 Alleata", neutrale: "⚖️ Neutrale", diffidente: "⚠️ Diffidente", ostile: "⚔️ Ostile",
};
// Le zone fisse della mappa della Taverna (richiesto in chat:
// movimento libero come l'Arena, non caselle cliccabili) - stessa
// griglia 0-10 già usata da renderArenaMap, per coerenza visiva.
// `radius`: quanto vicino deve arrivare il segnalino perché quella
// zona diventi "dove sei" (interazione con chi c'è vicino).
const TAVERN_ZONES = [
  { key: "bar", x: 5, y: 1.3, w: 6, h: 1.6, radius: 2.2, label: "Bancone" },
  { key: "table-1", x: 2, y: 3.6, w: 1.8, h: 1.8, radius: 1.3, label: "Tavolo 1" },
  { key: "table-2", x: 2, y: 6.6, w: 1.8, h: 1.8, radius: 1.3, label: "Tavolo 2" },
  { key: "table-3", x: 5, y: 5.2, w: 1.8, h: 1.8, radius: 1.3, label: "Tavolo 3" },
  { key: "table-4", x: 8, y: 3.6, w: 1.8, h: 1.8, radius: 1.3, label: "Tavolo 4" },
  { key: "table-5", x: 8, y: 6.6, w: 1.8, h: 1.8, radius: 1.3, label: "Tavolo 5" },
  { key: "door", x: 5, y: 9.3, w: 1.6, h: 0.9, radius: 1.4, label: "Porta" },
];
function tavernZoneAtPosition(x, y) {
  // Quale zona è abbastanza vicina da poterci interagire (richiesto in
  // chat: "in base a dove si trova, compare il menu di dialogo con le
  // persone vicine") - se sei lontano da tutte, null (in mezzo alla
  // sala, nessuna interazione disponibile).
  let closest = null;
  let closestDist = Infinity;
  for (const zone of TAVERN_ZONES) {
    const dist = Math.hypot(x - zone.x, y - zone.y);
    if (dist <= zone.radius && dist < closestDist) {
      closest = zone.key;
      closestDist = dist;
    }
  }
  return closest;
}
function renderTavernMapCanvas(mapData) {
  const SIZE = 340;
  const canvas = document.createElement("canvas");
  canvas.width = SIZE;
  canvas.height = SIZE;
  canvas.style.width = "100%";
  canvas.style.maxWidth = `${SIZE}px`;
  canvas.style.display = "block";
  canvas.style.margin = "0 auto";
  canvas.style.background = "var(--bg-panel-alt)";
  canvas.style.border = "1px solid var(--border)";
  canvas.style.borderRadius = "8px";
  canvas.style.cursor = "crosshair";
  const ctx = canvas.getContext("2d");
  const scale = SIZE / 10;
  // Sfondo a griglia leggera, stesso stile dell'Arena.
  ctx.strokeStyle = "rgba(120,130,150,0.2)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    ctx.beginPath();
    ctx.moveTo(i * scale, 0);
    ctx.lineTo(i * scale, SIZE);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * scale);
    ctx.lineTo(SIZE, i * scale);
    ctx.stroke();
  }
  // Le zone: il bancone come rettangolo dorato, i tavoli come cerchi,
  // la porta come rettangolo stretto.
  const occupantsByTable = {};
  for (const table of mapData.tables) occupantsByTable[`table-${table.table_number}`] = table.occupants;
  for (const zone of TAVERN_ZONES) {
    const px = zone.x * scale, py = zone.y * scale;
    ctx.lineWidth = 2;
    if (zone.key === "bar") {
      ctx.fillStyle = "rgba(212, 175, 55, 0.25)";
      ctx.strokeStyle = "var(--gold-dim)";
      ctx.fillRect(px - (zone.w * scale) / 2, py - (zone.h * scale) / 2, zone.w * scale, zone.h * scale);
      ctx.strokeRect(px - (zone.w * scale) / 2, py - (zone.h * scale) / 2, zone.w * scale, zone.h * scale);
    } else if (zone.key === "door") {
      ctx.fillStyle = "rgba(120, 130, 150, 0.3)";
      ctx.strokeStyle = "var(--text-secondary)";
      ctx.fillRect(px - (zone.w * scale) / 2, py - (zone.h * scale) / 2, zone.w * scale, zone.h * scale);
      ctx.strokeRect(px - (zone.w * scale) / 2, py - (zone.h * scale) / 2, zone.w * scale, zone.h * scale);
    } else {
      const occupied = (occupantsByTable[zone.key] || []).length > 0;
      ctx.fillStyle = occupied ? "rgba(63, 169, 106, 0.25)" : "rgba(120, 130, 150, 0.15)";
      ctx.strokeStyle = occupied ? "var(--success)" : "var(--border)";
      ctx.beginPath();
      ctx.arc(px, py, (zone.w * scale) / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.fillStyle = "var(--text-secondary)";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(zone.label, px, py + (zone.key === "bar" || zone.key === "door" ? 4 : (zone.h * scale) / 2 + 14));
  }
  // Il tuo segnalino.
  const playerPx = { x: state.tavernPlayerX * scale, y: state.tavernPlayerY * scale };
  ctx.fillStyle = "var(--gold)";
  ctx.strokeStyle = "#1a1a1a";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(playerPx.x, playerPx.y, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  canvas.addEventListener("click", (e) => {
    const rect = canvas.getBoundingClientRect();
    const gridX = ((e.clientX - rect.left) / rect.width) * 10;
    const gridY = ((e.clientY - rect.top) / rect.height) * 10;
    state.tavernPlayerX = Math.max(0.3, Math.min(9.7, gridX));
    state.tavernPlayerY = Math.max(0.3, Math.min(9.7, gridY));
    state.tavernPlayerPosition = tavernZoneAtPosition(state.tavernPlayerX, state.tavernPlayerY);
    render();
  });
  return canvas;
}

      sceneCard.append(el("button", { onClick: () => openTavernConversation(map.bartender.armor_name) }, `Parla con ${map.bartender.name}`));
    } else {
      const table = map.tables.find((t) => `table-${t.table_number}` === state.tavernPlayerPosition);
      if (table.occupants.length === 0) {
        sceneCard.append(el("p", {}, `Ti siedi da solo al ${table.label.toLowerCase()}. Nessuno, per ora, sembra intenzionato a raggiungerti - ma la serata è ancora lunga.`));
        sceneCard.append(el("button", { class: "secondary", onClick: refreshTavernMap }, "Aspetta un po' e guarda chi arriva"));

  // la relazione tra la tua fazione e quella del regno, così sai già

  // Maestro) - sblocca da solo con la Renown, nessun controllo da
  // fare qui: se non è ancora sbloccato o non ci sono segnalazioni,
  // semplicemente non si mostra nulla.
  if (state.scoutedAllies === null) loadScoutedAllies();
  if (state.scoutedAllies && state.scoutedAllies.unlocked && state.scoutedAllies.allies.length > 0) {
    const scoutCard = el("div", { class: "card" });
    scoutCard.append(el("h3", {}, "🔭 Segnalazioni dell'Osservatore"));
    scoutCard.append(el("p", { class: "hint" }, "PNG con cui hai già un rapporto promettente, prima ancora di tornare a parlarci."));

  wrap.append(listCard);

// --- Meditazione del Cosmo (richiesto in chat, dalla roadmap:
// mini-gioco ricorrente di taglio diverso dagli enigmi di logica
// degli Inferi - qui è un esercizio di memoria, stile Simon Says) ---
const MEDITATION_SYMBOL_LABELS = ["🔵", "🟡", "🔴", "🟣"];
async function loadMeditationStatus() {
  try {
    state.meditationStatus = await api(`/characters/${state.characterId}/meditation`);
  } catch (e) {
    showError(e.message);
    state.meditationStatus = { available: false, minutes_until_next: 0, sequence_length: 4 };
  }
  render();
}
async function startMeditation() {
  try {
    const result = await api(`/characters/${state.characterId}/meditation/start`, { method: "POST" });
    state.meditationSequence = result.sequence;
    state.meditationInput = [];
    state.meditationResult = null;
    state.meditationPhase = "showing";
    render();
    // Mostra la sequenza un simbolo alla volta, poi passa
    // all'inserimento - un semplice ciclo di attese, niente
    // dipendenze esterne per l'animazione.
    for (let i = 0; i < state.meditationSequence.length; i++) {
      await new Promise((r) => setTimeout(r, 700));
    }
    state.meditationPhase = "input";
    render();
  } catch (e) {
    showError(e.message);
  }
}
async function clickMeditationSymbol(symbolIndex) {
  if (state.meditationPhase !== "input") return;
  const position = state.meditationInput.length;
  state.meditationInput.push(symbolIndex);
  const expected = state.meditationSequence[position];
  if (symbolIndex !== expected) {
    // Sbagliato subito - il tentativo finisce qui, come nel Simon Says classico.
    await finishMeditationAttempt(false);
    return;
  }
  if (state.meditationInput.length === state.meditationSequence.length) {
    // Sequenza completata correttamente.
    await finishMeditationAttempt(true);
    return;
  }
  render();
}
async function finishMeditationAttempt(success) {
  state.meditationPhase = "result";
  render();
  try {
    const result = await api(`/characters/${state.characterId}/meditation/complete`, {
      method: "POST",
      body: JSON.stringify({ success, sequence_length: state.meditationSequence.length }),
    });
    state.meditationResult = { success, reward: result.reward };
    state.character = result.character;
  } catch (e) {
    showError(e.message);
  }
  render();
}
function closeMeditationResult() {
  state.meditationPhase = "idle";
  state.meditationSequence = null;
  state.meditationInput = [];
  state.meditationResult = null;
  state.meditationStatus = null;  // si ricarica da sola, col cooldown aggiornato
  render();
}
function renderMeditationTab() {
  const wrap = el("div");
  wrap.append(el("h1", {}, "Meditazione del Cosmo"));
  wrap.append(el("p", { class: "hint" }, "Un esercizio di concentrazione, non di logica - ricorda e riproduci la sequenza di impulsi cosmici. Una sequenza più lunga vale più Volontà."));
  if (state.meditationPhase === "result" && state.meditationResult) {
    const card = el("div", { class: "card" });
    const r = state.meditationResult;
    card.append(el("h2", {}, r.success ? "✨ Sequenza completata" : "La concentrazione si è spezzata"));
    if (r.success && r.reward) {
      card.append(el("p", {}, `+${r.reward.volonta} Volontà.`));
    } else {
      card.append(el("p", { class: "hint" }, "Ritenta più tardi - la concentrazione richiede riposo."));
    }
    card.append(el("button", { onClick: closeMeditationResult }, "Continua"));
    wrap.append(card);
    return wrap;
  }
  if (state.meditationPhase === "showing" || state.meditationPhase === "input") {
    const card = el("div", { class: "card" });
    card.append(el("p", { class: "hint" }, state.meditationPhase === "showing" ? "Osserva la sequenza..." : "Ora riproducila, nello stesso ordine."));
    const symbolRow = el("div", { class: "row", style: "justify-content:center;margin-top:16px;" });
    MEDITATION_SYMBOL_LABELS.forEach((label, idx) => {
      symbolRow.append(el("button", {
        style: "font-size:32px;padding:20px 26px;",
        ...(state.meditationPhase === "input" ? { onClick: () => clickMeditationSymbol(idx) } : { disabled: "disabled" }),
      }, label));
    });
    card.append(symbolRow);
    if (state.meditationPhase === "showing") {
      const sequenceDisplay = el("p", { style: "text-align:center;font-size:40px;margin-top:16px;" },
        state.meditationSequence.map((s) => MEDITATION_SYMBOL_LABELS[s]).join(" "));
      card.append(sequenceDisplay);
    } else {
      card.append(el("p", { class: "hint", style: "text-align:center;margin-top:10px;" }, `${state.meditationInput.length} / ${state.meditationSequence.length}`));
    }
    wrap.append(card);
    return wrap;
  }
  if (state.meditationStatus === null) {
    loadMeditationStatus();
    wrap.append(el("div", { class: "card" }, el("p", { class: "hint" }, "Caricamento...")));
    return wrap;
  }
  const ms = state.meditationStatus;
  const card = el("div", { class: "card" });
  if (ms.available) {
    card.append(el("p", {}, `Prossima sequenza: ${ms.sequence_length} impulsi.`));
    card.append(el("button", { onClick: startMeditation }, "🧘 Inizia la Meditazione"));
  } else {
    const ore = Math.ceil(ms.minutes_until_next / 60);
    card.append(el("p", { class: "hint" }, `Ti sei già concentrato di recente - torna tra circa ${ore} ${ore === 1 ? "ora" : "ore"} di gioco.`));
  }
  wrap.append(card);
  return wrap;
}

// Una card-galleria di sfondi (richiesto in chat: una per i 5 temi
// elementali, una per le 13 "sedi" di divinità) - stessa logica,
// riusata due volte invece di duplicarla.
function buildBackgroundGalleryCard(title, hint, labelsMap, backgrounds) {
  const card = el("div", { class: "card" });
  card.append(el("h2", {}, title));
  card.append(el("p", { class: "hint" }, hint));
  for (const [key, label] of Object.entries(labelsMap)) {
    const row = el("div", { style: "display:flex;align-items:center;gap:10px;margin-top:10px;" });
    if (backgrounds[key]) {
      row.append(el("img", { src: backgrounds[key], style: "width:60px;height:60px;object-fit:cover;border-radius:6px;flex-shrink:0;" }));
    } else {
      row.append(el("div", { style: "width:60px;height:60px;border:1px dashed var(--border);border-radius:6px;flex-shrink:0;" }));
    }
    const fileInput = el("input", { type: "file", accept: "image/*", style: "display:none;" });
    fileInput.addEventListener("change", (e) => { if (e.target.files[0]) uploadArenaBackground(e.target.files[0], key); });
    const col = el("div", { style: "flex:1;" });
    col.append(el("p", { style: "margin:0 0 4px;" }, label));
    col.append(fileInput);
    col.append(el("button", {
      class: "secondary",
      onClick: () => fileInput.click(),
    }, backgrounds[key] ? "Cambia" : "Carica"));
    row.append(col);
    card.append(row);
  }
  return card;
}

async function loadSoldierStatus() {
  try {

    showError(e.message);
    state.soldierStatus = { activities: [], denaro: 0 };

async function doSoldierActivity(activityKey) {
  try {

    });
    state.character.denaro = state.soldierActivityResult.denaro_total;

    showError(e.message);
  }

function renderGraphMissionNode(node) {
  const card = el("div", { class: "card" });
  if (node.type === "choice") {
    card.append(el("p", {}, node.text));
    if (state.missionChoiceResult) {
      card.append(el("p", { style: "font-style:italic;margin-top:8px;" }, state.missionChoiceResult.text));
      card.append(el("button", { onClick: () => { state.missionChoiceResult = null; state.missionStatus = null; render(); } }, "Continua"));
    } else {
      for (const opt of node.options) {
        card.append(el("button", { onClick: () => chooseMissionOption(opt.index) }, opt.label));
      }
    }
  } else if (node.type === "skill_check") {
    card.append(el("p", {}, node.text));
    if (state.missionActionResult) {
      const r = state.missionActionResult;
      card.append(el("p", { style: "font-style:italic;margin-top:8px;" }, r.text));
      card.append(el("button", { onClick: () => { state.missionActionResult = null; state.missionStatus = null; render(); } }, "Continua"));
    } else {
      card.append(el("button", { onClick: attemptMissionSkillCheck }, "🎲 Prova"));
    }
  } else if (node.type === "duel") {
    card.append(el("h2", {}, "Uno scontro ti attende"));
    card.append(el("p", { class: "hint" }, "Non sai ancora chi affronterai, finché non lo inizi."));
    card.append(el("button", { onClick: startMissionDuel }, "⚔ Inizia lo scontro"));
  } else if (node.type === "ending") {
    card.append(el("p", {}, node.text));
  }
  return card;
}

function tournamentRoundTitle(bracket, roundIndexZeroBased) {
  const roundNum = roundIndexZeroBased + 1;
  if (roundNum === bracket.total_rounds) return "Finale";
  if (roundNum === bracket.total_rounds - 1) return "Semifinale";
  return `Round ${roundNum}`;
}
function renderTournamentStatus(tournament) {
  // Richiesto in chat: struttura diversa dalle missioni a grafo, un
  // vero tabellone - qui non ci sono nodi/scelte, solo il progresso
  // nei round e un pulsante per lo scontro successivo.
  const card = el("div", { class: "card" });
  card.append(el("h2", {}, tournament.name));
  card.append(el("p", { class: "hint" }, `${tournament.round_label.charAt(0).toUpperCase() + tournament.round_label.slice(1)} - round ${tournament.round_number} di ${tournament.total_rounds}. Un torneo a eliminazione diretta: perdi e sei fuori, senza un altro tentativo.`));
  card.append(el("button", { onClick: startMissionDuel }, "⚔ Scendi in campo"));
  const wrap = el("div", {});
  wrap.append(card);
  // Il tabellone vero (richiesto in chat: "non si conosce i
  // partecipanti, il tabellone") - ma solo il PRIMO turno mostra nomi
  // reali fin da subito, come in un vero tabellone: i turni successivi
  // restano "Vincente Incontro X" finché non li raggiungi davvero
  // (corretto in chat: prima mostravo nomi già "decisi" per turni
  // futuri, come se il torneo li conoscesse in anticipo - un vero
  // tabellone non funziona così).
  const bracket = tournament.bracket;
  if (bracket) {
    const bracketCard = el("div", { class: "card" });
    bracketCard.append(el("h3", {}, "Tabellone"));
    for (let i = 0; i < bracket.rounds.length; i++) {
      const roundNum = i + 1;
      const roundData = bracket.rounds[i];
      const roundBox = el("div", { style: "margin-bottom:14px;" });
      let roundTitle = tournamentRoundTitle(bracket, i);
      const isFutureRound = roundNum > tournament.round_number;
      if (isFutureRound) roundTitle += " (se arrivi fin qui)";
      roundBox.append(el("p", { style: "font-weight:700;margin-bottom:6px;" }, roundTitle));
      for (let m = 0; m < roundData.matches.length; m++) {
        const [a, b] = roundData.matches[m];
        const involvesPlayer = a === bracket.player_slot || b === bracket.player_slot;
        const isNextMatch = involvesPlayer && roundNum === tournament.round_number;
        let lineText;
        if (isFutureRound) {
          // Turno non ancora raggiunto: niente nomi già "decisi" - solo
          // un riferimento a chi deve ancora vincere il turno prima.
          // Il giocatore può finire sia a sinistra che a destra della
          // coppia, quindi controllo entrambi i lati.
          const prevRoundTitle = tournamentRoundTitle(bracket, i - 1);
          const leftLabel = a === bracket.player_slot ? "Tu (se vinci prima)" : `Vincente ${prevRoundTitle} Incontro ${m * 2 + 1}`;
          const rightLabel = b === bracket.player_slot ? "Tu (se vinci prima)" : `Vincente ${prevRoundTitle} Incontro ${m * 2 + 2}`;
          lineText = `${leftLabel} vs ${rightLabel}`;
        } else {
          const slotA = bracket.slots[a];
          const slotB = bracket.slots[b];
          lineText = `${slotA.name}${slotA.is_player ? " (tu)" : ""} vs ${slotB.name}${slotB.is_player ? " (tu)" : ""}`;
        }
        const line = el("p", {
          class: isNextMatch ? "" : "hint",
          style: isNextMatch ? "font-weight:700;color:var(--gold);margin:2px 0;" : "margin:2px 0;",
        }, lineText);
        roundBox.append(line);
      }
      bracketCard.append(roundBox);
    }
    wrap.append(bracketCard);
  }
  return wrap;
}

  if (rightSprite) {
    rightSprite.style.display = "block";
    rightSprite.style.margin = "0 auto 8px auto";
    rightPanel.append(rightSprite);
  }
  rightPanel.append(el("h2", {}, o.name));
  rightPanel.append(el("p", { class: "hint" }, `${o.divinity} / ${o.faction} · Livello armatura ${o.armor_level}`));
  rightPanel.append(renderFullBar(o.vita_cur, o.vita_max, sharedMaxVita, "Vita", "vita"));
  rightPanel.append(renderFullBar(o.cosmo_cur, o.cosmo_max, sharedMaxCosmo));
  rightPanel.append(el("p", { class: "hint", style: "margin-top:10px;" }, "Le sue tecniche:"));
  for (const t of o.techniques) {
    rightPanel.append(el("button", { disabled: "disabled" }, `⚔ ${t.name} (${t.power})`));
  }
  columns.append(rightPanel);
  wrap.append(columns);
}
function renderFullBar(value, max, scaleMax, label = "Cosmo", kind = "cosmo") {
  // scaleMax (opzionale): il massimo più alto tra i due combattenti -
  // la CORNICE esterna si restringe in proporzione, così chi ha meno
  // massimo ha una barra fisicamente più corta, non solo una
  // percentuale diversa dentro una barra identica.
  const containerPct = scaleMax ? Math.max(15, Math.min(100, (max / scaleMax) * 100)) : 100;
  const fillPct = Math.max(0, Math.min(100, (value / Math.max(max, 1)) * 100));
  const outer = el("div", { style: `width:${containerPct}%;` });
  const barWrap = el("div", { class: "bar-wrap" });
  barWrap.append(el("div", { class: "bar-fill" + (kind === "vita" ? " vita" : ""), style: `width:${fillPct}%` }));
  barWrap.append(el("div", { class: "bar-label" }, `${label}: ${value} / ${max}`));
  outer.append(barWrap);
  return outer;
}
// Mappa 2D dell'Arena, Fase 1: griglia 10x10 come "righello", movimento
// libero/continuo (non a caselle - deciso in chat, stile Football
// Manager). Cliccare/toccare sposta il giocatore verso quel punto,
// entro i Punti Movimento disponibili - se troppo lontano, ci si ferma
// al massimo raggiungibile invece di rifiutare il click. La distanza
// non blocca ancora nulla nel combattimento (Fase 1: solo visiva).
//
// I due combattenti sono figure stilizzate (testa + mantello a
// triangolo), non più pallini - e dopo ogni colpo, battle.last_effect
// (impostato dal backend) dice alla mappa cosa disegnare: un fascio
// colorato per elemento della tecnica, un segno di scudo se parato,
// un segno d'impatto se il colpo è passato, o uno scarto laterale del
// colpito se ha schivato - tutto richiesto in chat.
function elementColor(techType) {
  const t = (techType || "").toLowerCase();
  if (t.includes("ghiaccio")) return "#AEE6FF";
  if (t.includes("fuoco")) return "#FF7043";
  if (t.includes("veleno")) return "#7CB342";
  if (t.includes("acqua")) return "#4FC3F7";
  if (t.includes("psichico") || t.includes("illusione")) return "#B266FF";
  if (t.includes("cosmico") || t.includes("cosmo")) return "#3FA9F5";
  if (t.includes("fisico")) return "#D4AF37";
  return "#EAE6DA"; // elemento non riconosciuto: colore neutro
}
function drawKnightFigure(ctx, x, y, color, label) {
  // Tornato al semplice cerchio (la figura testa+mantello "faceva
  // cacare" - parole tue): l'estetica vera aspetta il 3D, molto più
  // avanti. Per ora leggibilità sopra tutto.
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#EAE6DA";
  ctx.font = "11px Arial";
  ctx.textAlign = "center";
  ctx.fillText(label, x, y - 16);
}
// Una sola galleria "per Regno" (richiesto in chat: prima erano due
// gallerie separate, per elemento e per divinità - ridondanti e
// confuse). Ogni Regno (una delle 13 divinità del catalogo) ha un
// colore di sfondo predefinito, sostituibile con un'immagine propria
// caricata nella card "Arene per Regno" della scheda Arena. La chiave
// è anche quella usata per l'upload/il dizionario arena_backgrounds
// sul personaggio; "black_saint" è l'unica con lo spazio sostituito,
// per tutte le altre coincide con la versione minuscola del nome.
const REALM_ARENAS = {
  athena: { label: "Athena (Atene)", bg: "linear-gradient(#26324a, #0B0F1A)" },
  odino: { label: "Odino (Asgard)", bg: "linear-gradient(#cfe8f7, #7fa8c9)" },
  nettuno: { label: "Nettuno (Regno dei Sette Mari)", bg: "linear-gradient(#1a4a5e, #0d2b3d)" },
  hades: { label: "Hades (Inferi)", bg: "linear-gradient(#3a2050, #14081f)" },
  ares: { label: "Ares", bg: "linear-gradient(#5e1f1f, #2b0d0d)" },
  zeus: { label: "Zeus (Olimpo)", bg: "linear-gradient(#e8d9a0, #b89b4a)" },
  crono: { label: "Crono", bg: "linear-gradient(#7a6a4f, #3d3324)" },
  saturno: { label: "Saturno", bg: "linear-gradient(#6b6b6b, #2e2e2e)" },
  eris: { label: "Eris", bg: "linear-gradient(#4a1f4a, #1f0d1f)" },
  lucifero: { label: "Lucifero", bg: "linear-gradient(#5e0f0f, #1a0505)" },
  apollo: { label: "Apollo", bg: "linear-gradient(#f6cf8e, #d98e3a)" },
  artemide: { label: "Artemide", bg: "linear-gradient(#2f5e3a, #14291a)" },
  black_saint: { label: "Black Saint (Isola della Regina Nera)", bg: "linear-gradient(#3a3a3a, #0d0d0d)" },
};
const DEFAULT_REALM = "athena";
// Da nome vero della divinità (come arriva da battle.opponent.divinity)
// alla chiave "sicura" usata nel dizionario/URL - serve solo per
// "Black Saint", che ha uno spazio; per tutte le altre coincide con la
// versione minuscola del nome.
function divinityToKey(divinityName) {
  return (divinityName || "").toLowerCase().replace(/\s+/g, "_");
}
function renderArenaMap() {
  const SIZE = 340;
  const battle = state.battle;
  // Una sola chiave organizzativa ora: il Regno (la divinità)
  // dell'avversario (richiesto in chat: prima elemento e divinità
  // erano due sistemi separati e ridondanti) - niente avversario in
  // corso, si ricade su Athena come Regno predefinito.
  const realmKey = battle && battle.opponent ? divinityToKey(battle.opponent.divinity) : DEFAULT_REALM;
  const realm = REALM_ARENAS[realmKey] || REALM_ARENAS[DEFAULT_REALM];
  const canvas = document.createElement("canvas");
  canvas.width = SIZE;
  canvas.height = SIZE;
  canvas.style.width = "100%";
  canvas.style.maxWidth = `${SIZE}px`;
  canvas.style.display = "block";
  canvas.style.margin = "0 auto";
  // Un'immagine caricata per il Regno dell'avversario ha la precedenza
  // sul colore predefinito, se il giocatore ne ha caricata una.
  const backgrounds = (state.character && state.character.arena_backgrounds) || {};
  const customBg = backgrounds[realmKey];
  if (customBg) {
    canvas.style.backgroundImage = `url(${customBg})`;
    canvas.style.backgroundSize = "cover";
    canvas.style.backgroundPosition = "center";
  } else {
    canvas.style.background = realm.bg;
  }
  canvas.style.border = "1px solid var(--border)";
  canvas.style.borderRadius = "8px";
  const ctx = canvas.getContext("2d");
  const scale = SIZE / 10; // la griglia va da 0 a 10 in entrambi gli assi
  // Sfondo a griglia leggera, solo come riferimento visivo.
  ctx.strokeStyle = "rgba(120,130,150,0.25)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    ctx.beginPath();
    ctx.moveTo(i * scale, 0);
    ctx.lineTo(i * scale, SIZE);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * scale);
    ctx.lineTo(SIZE, i * scale);
    ctx.stroke();
  }
  const canMove = battle && !battle.pending_opponent_technique;
  // Effetti sul terreno (Fase 3): il ghiaccio come chiazza azzurra
  // semi-trasparente, i crateri come cerchio scuro, le fiamme come
  // cerchio arancione, il fango come cerchio marrone opaco -
  // disegnati PRIMA dei combattenti, così restano "sotto" di loro,
  // come lo sfondo.
  if (battle && battle.terrain_effects) {
    for (const eff of battle.terrain_effects) {
      const px = eff.x * scale;
      const py = eff.y * scale;
      const r = eff.radius * scale;
      if (eff.kind === "ghiaccio") {
        ctx.fillStyle = "rgba(174, 230, 255, 0.35)";
        ctx.strokeStyle = "rgba(174, 230, 255, 0.7)";
      } else if (eff.kind === "fiamme") {
        ctx.fillStyle = "rgba(255, 112, 67, 0.4)";
        ctx.strokeStyle = "rgba(255, 87, 34, 0.8)";
      } else if (eff.kind === "fango") {
        ctx.fillStyle = "rgba(93, 64, 55, 0.5)";
        ctx.strokeStyle = "rgba(62, 39, 35, 0.85)";
      } else {
        ctx.fillStyle = "rgba(20, 20, 20, 0.85)";
        ctx.strokeStyle = "#5a3a1a";
      }
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }
  if (battle) {
    const effect = battle.last_effect;
    // Posizioni a schermo (pixel), partendo da quelle vere sulla griglia.
    let playerPx = { x: battle.player_position.x * scale, y: battle.player_position.y * scale };
    let opponentPx = { x: battle.opponent_position.x * scale, y: battle.opponent_position.y * scale };
    // Su una schivata, il colpito si scosta lateralmente SOLO per
    // questo disegno - non tocca la sua posizione vera sulla griglia
    // (quella resta quella tattica, gestita a parte).
    if (effect && effect.outcome === "miss") {
      const dodgerPx = effect.attacker === "player" ? opponentPx : playerPx;
      dodgerPx.x = Math.min(SIZE - 15, dodgerPx.x + 28);
    }
    // Il fascio della tecnica: solo se il colpo è arrivato (parato o
    // no) - su una schivata non ha senso disegnarlo, non ha mai toccato.
    if (effect && (effect.outcome === "hit" || effect.outcome === "blocked")) {
      const fromPx = effect.attacker === "player" ? playerPx : opponentPx;
      const toPx = effect.attacker === "player" ? opponentPx : playerPx;
      ctx.strokeStyle = elementColor(effect.tech_type);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(fromPx.x, fromPx.y);
      ctx.lineTo(toPx.x, toPx.y);
      ctx.stroke();
    }
    drawKnightFigure(ctx, opponentPx.x, opponentPx.y, "#C0392B", battle.opponent.name.split(" ").slice(-1)[0]);
    drawKnightFigure(ctx, playerPx.x, playerPx.y, "#3FA9F5", "Tu");
    // Segno di parata/colpo sopra chi ha subito l'attacco.
    if (effect && (effect.outcome === "hit" || effect.outcome === "blocked")) {
      const targetPx = effect.attacker === "player" ? opponentPx : playerPx;
      ctx.font = "20px Arial";
      ctx.textAlign = "center";
      ctx.fillText(effect.outcome === "blocked" ? "🛡" : "💥", targetPx.x + 18, targetPx.y - 18);
    }
  }
  canvas.style.cursor = canMove ? "crosshair" : "default";
  if (canMove) {
    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const gridX = ((e.clientX - rect.left) / rect.width) * 10;
      const gridY = ((e.clientY - rect.top) / rect.height) * 10;
      movePlayerTo(gridX, gridY);
    });
  }
  return canvas;
}
// --- Avvio ---
async function loadAppVersion() {
  try {
    const info = await api("/");
    state.appVersion = info.version || null;
    if (state.appVersion) document.title = `Saint Seiya: Sacro Imperio — ${state.appVersion}`;
    render();  // se la schermata iniziale è già disegnata, la ridisegna con la versione visibile
  } catch (e) {
    // Non blocchiamo l'avvio dell'app se questa chiamata fallisce - la
    // versione è un'informazione utile, non essenziale per giocare.
  }
}
loadAppVersion();
loadStartPage();
</script>
